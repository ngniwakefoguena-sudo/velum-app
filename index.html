let _rendering=false;
function fitNav(){
  const mn=document.querySelector('.nav .menus');if(!mn)return;
  const more=mn.querySelector('.mi.more');if(!more)return;
  const items=[...mn.children].filter(x=>x!==more);
  items.forEach(x=>x.style.display='');more.style.display='none';
  const avail=mn.clientWidth;
  const w=()=>items.reduce((a,x)=>a+(x.style.display==='none'?0:x.offsetWidth),0);
  if(w()<=avail){return}
  more.style.display='';const mw=more.offsetWidth||44;
  const hid=[];
  for(let i=items.length-1;i>=0&&w()+mw>avail;i--){items[i].style.display='none';hid.push(items[i].dataset.mid)}
  more.querySelectorAll('[data-mg]').forEach(g=>{g.style.display=hid.includes(g.dataset.mg)?'':'none'});
}

CUSTOM.discuss=function(){
  const chans=D.all('channel');
  const tab=UI.dtab||'channels';
  const sel=UI.ch&&D.get('channel',UI.ch)?UI.ch:(chans.find(c=>c.kind==='channel')||chans[0]).id;
  UI.ch=sel;
  const cur=D.get('channel',sel);
  const q=(UI.dq||'').toLowerCase();
  const bots=D.all('message').filter(m=>m.author===0);
  let list='';
  if(tab==='inbox'){
    list=bots.slice().reverse().map(m=>'<button class="conv" data-a="dsc-bot" data-id="'+m.id+'">'+avatar('Vélume Bot')+'<span class="cm"><b>Vélume Bot</b><span class="muted">'+esc(m.text)+'</span></span></button>').join('')||'<p class="muted">'+tr('Boîte de réception vide.','Inbox empty.')+'</p>';
  }else{
    list=chans.filter(c=>(tab==='chats'?c.kind==='chat':c.kind==='channel')&&(!q||c.name.toLowerCase().includes(q))).map(c=>{const m=lastMsg(c.id);return '<button class="conv'+(c.id===sel?' on':'')+'" data-a="dsc-sel" data-id="'+c.id+'">'+avatar(c.name,'',c.kind==='chat')+'<span class="cm"><b>'+(c.kind==='channel'?'# ':'')+esc(c.name)+'</b><span class="muted">'+esc(m.text?String(m.text).slice(0,50):(c.desc||'—'))+'</span></span></button>'}).join('');
  }
  const msgs=D.all('message').filter(m=>m.channel===sel).sort((a,b)=>a.date>b.date?1:-1);
  const thread='<div class="kdh"><button class="ib dsc-back" data-a="dsc-back" aria-label="back">'+ic('chevL')+'</button><b>'+(cur.kind==='channel'?'# ':'')+esc(cur.name)+'</b><span class="muted" style="font-size:.86rem">'+esc(cur.desc||'')+'</span><span class="sp"></span><span class="badge">'+(cur.members||[]).length+' '+tr('membres','members')+'</span></div>'+
    '<div class="cwb">'+(msgs.length?msgs.map(m=>{const who=m.author?D.name('employee',m.author):'Vélume Bot';return '<div class="msg">'+avatar(who)+'<div class="mb"><div class="mh"><b>'+esc(who)+'</b> <span class="muted">'+esc(fmtDT(m.date))+'</span></div><div>'+esc(m.text)+'</div>'+(m.link?'<a data-a="aigo" data-n="billing:i_inv">'+tr('Voir','View')+'</a>':'')+'</div></div>'}).join(''):'<div class="emp">'+ic('chat','big')+'<h3>'+tr('Aucun message','No messages')+'</h3><p class="muted">'+tr('Écrivez le premier message.','Write the first message.')+'</p></div>')+'</div>'+
    (cur.bot?'<div class="cwf"><span class="muted">'+tr('Vélume Bot envoie des alertes automatiques (voir Paramètres › Actions automatisées).','Vélume Bot sends automatic alerts (see Settings › Automated actions).')+'</span></div>':'<div class="cwf"><input id="chin" data-fk="chin" placeholder="'+tr('Écrire dans #'+cur.name+'...','Message #'+cur.name+'...')+'" autocomplete="off"><button class="btn pri" data-a="dsc-send">'+ic('send')+'</button></div>');
  const rail=[['inbox','chat2',tr('Boîte de réception','Inbox'),bots.length],['chats','user',tr('Chats','Chats')],['channels','team',tr('Canaux','Channels')]];
  return '<div class="va gut" style="padding-top:12px"><div class="dsc'+(UI.dthread?' openthread':'')+'"><div class="rail">'+rail.map(r=>'<button data-a="dsc-tab" data-t="'+r[0]+'" aria-pressed="'+(tab===r[0])+'">'+ic(r[1])+'<span>'+r[2]+'</span></button>').join('')+'</div>'+
    '<div class="list"><div class="promo">'+ic('bolt')+'<div class="pt"><b>'+tr('Vélume Bot est actif','Vélume Bot is on')+'</b><div style="font-size:.84rem">'+tr('Alertes factures, locations, sondages.','Invoice, rental and survey alerts.')+'</div></div></div>'+
    '<div class="sbox" style="margin:2px 0"><input id="dq" data-fk="dq" placeholder="'+tr('Trouver ou démarrer une conversation','Find or start a conversation')+'" value="'+esc(UI.dq||'')+'"></div>'+
    '<button class="btn sm" data-a="dsc-new" style="align-self:flex-start">'+ic('plus')+tr('Nouveau canal','New channel')+'</button>'+list+'</div><div class="thread">'+thread+'</div></div></div>';
};

function cleanHtml(h){const t=document.createElement('template');t.innerHTML=String(h||'');t.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n=>n.remove());t.content.querySelectorAll('*').forEach(n=>{Array.from(n.attributes).forEach(a=>{if(/^on/i.test(a.name)||(/^(href|src)$/i.test(a.name)&&/^\s*javascript:/i.test(a.value)))n.removeAttribute(a.name)})});return t.innerHTML}
CUSTOM.knowledge=function(){
  const arts=D.all('article');const q=(UI.kq2||'').toLowerCase();
  const cur=D.get('article',UI.art)||arts[0];UI.art=cur?cur.id:null;
  const tree=(parent,sec,depth)=>arts.filter(a=>(a.parent||null)===parent&&(parent?true:a.section===sec)&&(!q||a.name.toLowerCase().includes(q)||tree(a.id,sec,0)!=='')).map(a=>'<button class="it'+(cur&&a.id===cur.id?' on':'')+'" style="padding-left:'+(10+depth*16)+'px" data-a="art-sel" data-id="'+a.id+'"><span>'+esc(a.icon||'📄')+'</span><span style="overflow:hidden;text-overflow:ellipsis">'+esc(tx(a.name))+'</span></button>'+tree(a.id,sec,depth+1)).join('');
  const sec=(k,l)=>'<div class="sec" style="display:flex;justify-content:space-between;align-items:center">'+l+'<button class="ib" data-a="art-new" data-s="'+k+'" aria-label="'+tr('Nouvel article','New article')+'">'+ic('plus')+'</button></div>'+tree(null,k,0);
  const fav=arts.filter(a=>a.fav).map(a=>'<button class="it'+(cur&&a.id===cur.id?' on':'')+'" data-a="art-sel" data-id="'+a.id+'"><span>'+esc(a.icon)+'</span>'+esc(tx(a.name))+'</button>').join('');
  const side='<aside class="ksb"><div class="sbox"><input id="dq2" data-fk="dq2" placeholder="'+tr('Rechercher un article...','Search an article...')+'" value="'+esc(UI.kq2||'')+'"></div>'+
    (fav?'<div class="sec">'+tr('Favoris','Favorites')+'</div>'+fav:'')+sec('workspace',tr('Espace de travail','Workspace'))+sec('shared',tr('Partagés','Shared'))+sec('private',tr('Privés','Private'))+'</aside>';
  let doc;
  if(!cur)doc='<div class="emp">'+ic('book','big')+'<h3>'+tr('Aucun article','No article')+'</h3><button class="btn pri" data-a="art-new" data-s="workspace">'+tr('Nouvel article','New article')+'</button></div>';
  else doc='<div class="kdh"><button class="ib ksb-btn" data-a="ksb" aria-label="menu">'+ic('menu')+'</button><span style="font-size:1.3rem">'+esc(cur.icon)+'</span><span class="muted">'+esc(selLabel(M.article.f.section,cur.section))+'</span><span class="sp"></span><span class="muted" style="font-size:.82rem">'+tr('Modifié le ','Updated ')+esc(fmtDT(cur.upd))+'</span>'+
    '<button class="ib" data-a="art-fav" aria-label="favorite" style="color:'+(cur.fav?'var(--gold)':'var(--ink-2)')+'">'+ic('star',cur.fav?'fill':'')+'</button><button class="ib" data-a="art-del" aria-label="delete">'+ic('trash')+'</button></div>'+
    '<div class="ktool">'+[['bold','B'],['italic','I'],['h2','H2'],['ul','• '+tr('Liste','List')],['cb','☑ '+tr('Case','Task')],['mark','▮ '+tr('Surligner','Highlight')]].map(b=>'<button data-a="kfmt" data-c="'+b[0]+'" data-nofocus>'+b[1]+'</button>').join('')+'<button data-a="art-child" data-nofocus>＋ '+tr('Sous-article','Sub-article')+'</button></div>'+
    '<div class="kbody"><div class="inner"><input class="ktitle" id="ktitle" data-fk="ktitle" value="'+esc(cur.name)+'" placeholder="'+tr('Titre','Title')+'"><div class="ked" id="ked" contenteditable="true" role="textbox" aria-multiline="true" aria-label="'+tr('Contenu de l’article','Article content')+'">'+cleanHtml(cur.body)+'</div></div></div>';
  return '<div class="va gut" style="padding-top:12px"><div class="kn'+(UI.ksb?' showsb':'')+'">'+side+'<section class="kdoc">'+doc+'</section></div></div>';
};
A['ksb']=()=>{UI.ksb=!UI.ksb;render()};
A['art-sel']=el=>{saveArticle();UI.art=+el.dataset.id;UI.ksb=false;render()};
A['art-new']=el=>{saveArticle();const a=D.create('article',{name:tr('Nouvel article','New article'),icon:'📄',section:el.dataset.s||'workspace',body:'<p></p>'},{silent:true});UI.art=a.id;UI.ksb=false;render();setTimeout(()=>{const e=$('#ktitle');if(e){e.focus();e.select()}},40)};
A['art-child']=()=>{saveArticle();const p=D.get('article',UI.art);const a=D.create('article',{name:tr('Sous-article','Sub-article'),icon:'📄',section:p.section,parent:p.id,body:'<p></p>'},{silent:true});UI.art=a.id;render()};

A['kfmt']=el=>{
  const ed=$('#ked');if(!ed)return;ed.focus();const c=el.dataset.c;
  try{
    if(c==='bold')document.execCommand('bold');else if(c==='italic')document.execCommand('italic');
    else if(c==='h2')document.execCommand('formatBlock',false,'h2');else if(c==='ul')document.execCommand('insertUnorderedList');
    else if(c==='cb')document.execCommand('insertHTML',false,'<div class="cb"><input type="checkbox"> '+tr('À faire','To do')+'</div>');
    else if(c==='mark')document.execCommand('hiliteColor',false,'#F3E4BD');
  }catch(e){}
  saveArticle();
};
function saveArticle(){
  const ed=$('#ked'),ti=$('#ktitle');if(!ed||!UI.art||!D.get('article',UI.art))return;
  ed.querySelectorAll('input[type=checkbox]').forEach(c=>{if(c.checked)c.setAttribute('checked','');else c.removeAttribute('checked')});
  const body=cleanHtml(ed.innerHTML);const a=D.get('article',UI.art);
  const v={};if(body!==a.body)v.body=body;if(ti&&ti.value.trim()&&ti.value!==a.name)v.name=ti.value.trim();
  if(Object.keys(v).length){v.upd=isoDT(new Date());D.write('article',UI.art,v,{silent:true})}
}
document.addEventListener('focusout',e=>{const t=e.target;if(t&&(t.id==='ked'||t.id==='ktitle')){saveArticle();if(t.id==='ktitle')render()}});
document.addEventListener('change',e=>{if(e.target&&e.target.closest&&e.target.closest('.ked'))saveArticle()});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('[data-nofocus]'))e.preventDefault()});
document.addEventListener('input',e=>{if(e.target.id==='dq2'){UI.kq2=e.target.value;render()}});

function chartBlock(title,type,data,fmtV,note){
  const rowsT='<details style="margin-top:8px"><summary class="muted" style="cursor:pointer">'+tr('Voir les données','View data')+'</summary><div class="scrollx"><table class="pv"><thead><tr><th></th>'+data.series.map(s=>'<th>'+esc(s.label)+'</th>').join('')+'</tr></thead><tbody>'+data.cats.map((c,i)=>'<tr><td>'+esc(c.label)+'</td>'+data.series.map(s=>'<td class="num">'+fmtV(s.values[i])+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></details>';
  const fv0=fmtV;fmtV=(v,c)=>c&&/FCFA/.test(fv0(1))?compact(v):fv0(v);
  return '<div class="card"><h3 style="margin-bottom:6px">'+esc(title)+'</h3>'+(note?'<p class="muted" style="font-size:.86rem;margin-bottom:6px">'+note+'</p>':'')+'<div class="chart" data-chart>'+chartSvg(type,data,fmtV,true)+'</div>'+legendHtml(type,data)+rowsT+'</div>';
}
const compact=v=>v>=1e6?fmt2(v/1e6)+' M':v>=1e3?fmt(v/1e3)+' k':fmt(v);
CUSTOM.boards=function(){

/* ---------- Online booking (Appointments) ---------- */
function slotsFor(type,dateStr){
  const dur=Math.max(.5,type.dur||1);const out=[];
  const busy=D.all('rental').filter(r=>r.studio===type.studio&&r.state!=='cancel'&&(r.start||'').slice(0,10)===dateStr);
  for(let h=9;h+dur<=20;h+=Math.max(1,Math.ceil(dur))){
    const s=pd(dateStr+'T'+pad(h)+':00'),e=addMin(s,dur*60);
    const clash=busy.some(r=>pd(r.start)<e&&pd(r.stop)>s);
    const past=s<new Date();
    out.push({h:h,label:pad(h)+':00',busy:clash||past});
  }
  return out;
}
function bookingHtml(){
  const types=D.all('apptype').filter(t=>t.active);
  const bk=UI.bk=UI.bk||{};

  if(!bk.type&&types.length)bk.type=types[0].id;
  const type=D.get('apptype',bk.type);
  if(bk.done){
    return '<div class="emp">'+ic('check','big')+'<h3>'+tr('Réservation enregistrée','Booking recorded')+'</h3><p>'+esc(bk.done)+'</p><p class="muted">'+tr('Un acompte de '+(ST.set.deposit_pct||50)+' % confirme le créneau (Orange Money, MTN MoMo ou espèces sur place).','A '+(ST.set.deposit_pct||50)+'% deposit confirms the slot (Orange Money, MTN MoMo or cash on site).')+'</p><button class="btn pri" data-a="bk-again">'+tr('Nouvelle réservation','New booking')+'</button></div>';
  }
  const days=Array.from({length:7},(_,i)=>addDays(sod(new Date()),i+(new Date().getHours()>=18?1:0)));
  if(!bk.date)bk.date=iso(days[0]);
  const slots=type?slotsFor(type,bk.date):[];
  return '<div style="max-width:720px;margin:0 auto;display:grid;gap:14px"><div class="card"><h2>'+tr('Réserver chez Vélume','Book at Vélume')+'</h2><p class="muted">'+tr('Choisissez un service, un jour et un créneau.','Choose a service, a day and a slot.')+'</p></div>'+
    '<div class="card"><h3>1. '+tr('Service','Service')+'</h3><div class="seg" role="group" style="margin-top:8px">'+types.map(t=>'<button data-a="bk-type" data-id="'+t.id+'" aria-pressed="'+(bk.type===t.id)+'">'+esc(tx(t.name))+' · '+fmt2(t.dur)+' h</button>').join('')+'</div>'+(type&&type.product?'<p class="muted" style="margin-top:8px">'+tr('Tarif : ','Price: ')+'<b>'+money((D.get('product',type.product)||{}).price||0)+'</b> TTC</p>':'')+'</div>'+
    '<div class="card"><h3>2. '+tr('Jour','Day')+'</h3><div class="seg" role="group" style="margin-top:8px">'+days.map(d=>'<button data-a="bk-date" data-d="'+iso(d)+'" aria-pressed="'+(bk.date===iso(d))+'">'+dayName(d)+' '+d.getDate()+'</button>').join('')+'</div></div>'+
    '<div class="card"><h3>3. '+tr('Créneau','Slot')+'</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+slots.map(s=>'<button class="btn'+(bk.slot===s.h?' pri':'')+'" '+(s.busy?'disabled':'')+' data-a="bk-slot" data-h="'+s.h+'">'+s.label+'</button>').join('')+'</div></div>'+
    '<div class="card"><h3>4. '+tr('Vos coordonnées','Your details')+'</h3><div class="fld" style="margin-top:8px"><label>'+tr('Nom complet','Full name')+'</label><input data-m="bkname" data-bk="name" type="text" value="'+esc(bk.name||'')+'"></div><div class="fld"><label>'+tr('Téléphone / WhatsApp','Phone / WhatsApp')+'</label><input data-m="bkphone" data-bk="phone" type="text" value="'+esc(bk.phone||'')+'"></div>'+
    '<button class="btn pri" data-a="bk-confirm">'+tr('Confirmer la réservation','Confirm booking')+'</button></div></div>';

function rentalInvoice(id){
  const r=D.get('rental',id);if(!r)return;
  if(r.inv){toast(tr('Déjà facturée.','Already invoiced.'));return}
  const lines=(r.lines||[]).map(l=>({desc:tx(D.name('product',l.product)),qty:l.qty,price:Math.round(l.price/(1+TVA()/100))}));
  const inv=D.create('invoice',{kind:'out_invoice',partner:r.partner,date:iso(new Date()),due:iso(addDays(new Date(),7)),journal:(D.all('journal').find(j=>j.kind==='sale')||{}).id,ref:r.ref,state:'posted',lines:lines});
  D.write('rental',id,{state:'returned',inv:inv.id});
  toast(tr('Facture créée : ','Invoice created: ')+inv.number);
}
function copyPrevWeek(){
  const a=curAct();const vs=vstate(a);const ws=startOfWeek(pd(vs.gantt.date)),pws=addDays(ws,-7);
  const prev=D.all('slot').filter(s=>{const d=sod(pd(s.start));return d>=pws&&d<ws});
  const have=new Set(D.all('slot').filter(s=>{const d=sod(pd(s.start));return d>=ws&&d<addDays(ws,7)}).map(s=>s.emp+'|'+s.start.slice(0,10)+'|'+s.start.slice(11,13)));
  let n=0;prev.forEach(s=>{const ns=isoDT(addDays(pd(s.start),7)),ne=isoDT(addDays(pd(s.stop),7));if(have.has(s.emp+'|'+ns.slice(0,10)+'|'+ns.slice(11,13)))return;D.create('slot',{emp:s.emp,role:s.role,project:s.project,name:s.name,start:ns,stop:ne,state:'draft'},{silent:true});n++});
  toast(tr(n+' créneau(x) copié(s) depuis la semaine précédente.',n+' shift(s) copied from the previous week.'));render();
}
function autoPlan(){
  const a=curAct();const vs=vstate(a);const ws=startOfWeek(pd(vs.gantt.date));
  const mine=D.all('slot');const have=new Set(mine.filter(s=>{const d=sod(pd(s.start));return d>=ws&&d<addDays(ws,7)}).map(s=>s.emp));
  let n=0;
  D.all('employee').forEach(e=>{if(have.has(e.id))return;const role=D.all('slot').filter(s=>s.emp===e.id).map(s=>s.role)[0];
    for(let k=0;k<5;k++){const d=addDays(ws,k);const s=new Date(d);s.setHours(8,0,0,0);const en=new Date(d);en.setHours(16,0,0,0);D.create('slot',{emp:e.id,role:role,start:isoDT(s),stop:isoDT(en),state:'draft',name:tr('Service','Shift')},{silent:true});n++}});
  toast(n?tr(n+' créneau(x) proposé(s) pour les employés non planifiés.',n+' shift(s) proposed for unscheduled employees.'):tr('Tous les employés sont déjà planifiés cette semaine.','All employees are already scheduled this week.'));render();
}

MODALS.sign={title:()=>tr('Signer le document','Sign the document'),wide:true,
  body:p=>{const d=D.get('sigdoc',p.id);const tp=D.get('sigtpl',d.tpl);
    return '<div class="doc"><ol style="line-height:1.7;margin-top:0">'+String(tp?tp.body:'').split('\n').filter(Boolean).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div><p style="margin:12px 0 4px"><b>'+esc(D.name('partner',d.partner))+'</b> — '+tr('dessinez votre signature :','draw your signature:')+'</p><canvas id="sigpad" width="520" height="160" style="width:100%;max-width:520px;height:160px;border:1px dashed var(--line-2);border-radius:10px;background:var(--bg);touch-action:none" aria-label="signature"></canvas><div><button class="btn sm ghost" data-a="sig-clear">'+tr('Effacer','Clear')+'</button></div>'},
  foot:()=>'<button class="btn pri" data-a="sig-ok">'+ic('pen')+tr('Adopter et signer','Adopt and sign')+'</button><button class="btn" data-a="mclose">'+tr('Annuler','Cancel')+'</button>'};
let _sig={on:false,dirty:false};
document.addEventListener('pointerdown',e=>{if(e.target.id!=='sigpad')return;const c=e.target,r=c.getBoundingClientRect(),ctx=c.getContext('2d');_sig.on=true;ctx.lineWidth=2.2;ctx.lineCap='round';ctx.strokeStyle=getComputedStyle(document.body).color;ctx.beginPath();ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);try{c.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!_sig.on||e.target.id!=='sigpad')return;const c=e.target,r=c.getBoundingClientRect(),ctx=c.getContext('2d');ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);ctx.stroke();_sig.dirty=true});
document.addEventListener('pointerup',()=>{_sig.on=false});
A['sig-clear']=()=>{const c=$('#sigpad');if(c){c.getContext('2d').clearRect(0,0,c.width,c.height);_sig.dirty=false}};
A['sig-ok']=()=>{const c=$('#sigpad');if(!_sig.dirty)return toast(tr('Veuillez dessiner votre signature.','Please draw your signature.'));const data=c.toDataURL('image/png');const id=UI.modal.p.id;_sig.dirty=false;
  D.write('sigdoc',id,{state:'signed',signedat:isoDT(new Date()),sig:data});UI.modal=null;if(FV&&FV.id===id)FV.buf=clone(D.get('sigdoc',id));toast(tr('Document signé','Document signed'));render()};
MODALS.survey={title:p=>tr('Tester : ','Test: ')+tx(D.name('survey',p.id)),wide:true,
  body:p=>{const s=D.get('survey',p.id);return '<div class="fld"><label>'+tr('Votre nom (facultatif)','Your name (optional)')+'</label><input data-m="who" type="text"></div>'+(s.questions||[]).map((q,i)=>{
    const qt=esc(tx(q.q));
    if(q.type==='rating')return '<div class="fld"><label>'+qt+'</label><div class="seg" role="group">'+[1,2,3,4,5].map(n=>'<button data-a="sv-rate" data-i="'+i+'" data-n="'+n+'" aria-pressed="'+((UI.modal.data['q'+i]||0)===n)+'">'+n+'</button>').join('')+'</div></div>';
    if(q.type==='yesno')return '<div class="fld"><label>'+qt+'</label><div class="seg" role="group">'+[['yes',tr('Oui','Yes')],['no',tr('Non','No')]].map(o=>'<button data-a="sv-pick" data-i="'+i+'" data-v="'+o[0]+'" aria-pressed="'+(UI.modal.data['q'+i]===o[0])+'">'+o[1]+'</button>').join('')+'</div></div>';
    if(q.type==='choice')return '<div class="fld"><label>'+qt+'</label><div class="seg" role="group">'+String(q.choices||'').split(',').map(c=>c.trim()).filter(Boolean).map(c=>'<button data-a="sv-pick" data-i="'+i+'" data-v="'+esc(c)+'" aria-pressed="'+(UI.modal.data['q'+i]===c)+'">'+esc(c)+'</button>').join('')+'</div></div>';
    return '<div class="fld"><label>'+qt+'</label><textarea data-m="q'+i+'" rows="2"></textarea></div>'}).join('')},
  foot:()=>'<button class="btn pri" data-a="sv-send">'+tr('Envoyer mes réponses','Submit answers')+'</button><button class="btn" data-a="mclose">'+tr('Annuler','Cancel')+'</button>'};
A['sv-rate']=el=>{UI.modal.data['q'+el.dataset.i]=+el.dataset.n;render()};
A['sv-pick']=el=>{UI.modal.data['q'+el.dataset.i]=el.dataset.v;render()};
A['sv-send']=()=>{
  const s=D.get('survey',UI.modal.p.id),d=UI.modal.data;const rates=(s.questions||[]).map((q,i)=>q.type==='rating'?d['q'+i]:null).filter(x=>x);
  D.create('surveyans',{survey:s.id,who:d.who||tr('Anonyme','Anonymous'),score:rates.length?Math.round(sum(rates)/rates.length*10)/10:null,answers:JSON.stringify(d),state:'done'});
  D.write('survey',s.id,{},{silent:true});UI.modal=null;toast(tr('Merci ! Réponse enregistrée.','Thanks! Answer recorded.'));render();
};

CUSTOM.apps=function(){
  const cat=UI.acat||'all';const q=(UI.aq||'').toLowerCase();
  const own=APPS.filter(a=>!a.core).map(a=>({id:a.id,fr:a.l[0],en:a.l[1],dfr:APPDESC[a.id][0],den:APPDESC[a.id][1],cfr:APPDESC[a.id][2],cen:APPDESC[a.id][3],icon:a.icon,color:a.color,real:true}));

function receivePurchase(id){
  const p=D.get('purchase',id);if(!p||p.state==='received')return;
  (p.lines||[]).forEach(l=>{const it=D.get('stockitem',+l.item);if(!it)return;D.write('stockitem',it.id,{qty:(+it.qty||0)+(+l.qty||0),cost:l.price||it.cost},{silent:true});
    D.create('stockmove',{item:it.id,kind:'in',qty:+l.qty||0,ref:p.name,note:tr('Réception ','Receipt ')+p.name},{silent:true})});
  D.write('purchase',id,{state:'received'});if(FV&&FV.id===id)FV.buf=clone(D.get('purchase',id));toast(tr('Marchandise reçue, stock mis à jour.','Goods received, stock updated.'));render();
}

A['adj-ok']=()=>{
  const p=UI.modal.p,d=UI.modal.data,q=+d.qty;if(!isFinite(q)||d.qty===undefined||d.qty==='')return toast(tr('Saisissez une quantité.','Enter a quantity.'));
  const it=D.get(p.m,p.id);
  if(p.m==='stockitem'){
    let nq=+it.qty||0,mv=q;
    if(p.kind==='in')nq+=q;else if(p.kind==='inv'){mv=q-nq;nq=q}else{nq-=q}
    if(nq<0)return toast(tr('Stock insuffisant.','Not enough stock.'));
    D.write('stockitem',it.id,{qty:nq},{silent:true});D.create('stockmove',{item:it.id,kind:p.kind,qty:Math.abs(mv),note:d.note||''},{silent:true});
    if(nq<=(+it.min||0)){postBot&&postBot(tr('Stock bas : ','Low stock: ')+tx(it.name)+' ('+nq+' '+(it.unit||'')+')')}
  }else if(p.m==='member'){D.write('member',it.id,p.kind==='pts'?{points:Math.max(0,(+it.points||0)+q)}:{wallet:(+it.wallet||0)+q})}
  else{D.write('giftcard',it.id,{balance:Math.max(0,(+it.balance||0)+q)})}
  UI.modal=null;if(FV&&FV.id===p.id)FV.buf=clone(D.get(p.m,p.id));toast(tr('Enregistré','Saved'));render();
};

  const day=b.date||iso(new Date());const os=D.all('posorder').filter(o=>(o.date||'').slice(0,10)===day&&o.state!=='cancel'&&o.state!=='draft');

}

function unreadOf(c){return D.all('message').filter(m=>m.channel===c.id&&m.read===false).length}
function msgHtml(m,c,prevDay){
  const sep=dayKey(m.date)!==prevDay?'<div class="dsep"><span>'+esc(fmtDate(m.date))+'</span></div>':'';
  if(m.call){
    const k=D.get('call',m.call);const live=k&&k.state==='ongoing'&&UI.meet&&UI.meet.callId===k.id;
    return sep+'<div class="callmsg">'+ic(k&&k.kind==='audio'?'phone':'video')+'<div style="flex:1"><b>'+esc(m.text)+'</b><div class="muted" style="font-size:.84rem">'+esc(fmtHM(pd(m.date)))+(k&&k.state==='done'?' · '+k.mins+' min':'')+'</div></div>'+(k&&k.state==='ongoing'?'<button class="btn sm pri" data-a="mt-join" data-id="'+k.id+'">'+(live?tr('Dans la réunion','In the meeting'):tr('Rejoindre','Join'))+'</button>':'')+'</div>';
  }
  if(c.kind==='wa'){
    const inb=m.dir==='in';const tick=m.dir==='out'?'<span class="tk '+(m.ack==='read'?'rd':'')+'">'+(m.ack==='sent'?'✓':'✓✓')+'</span>':'';
    return sep+'<div class="wam '+(inb?'in':'out')+'"><div class="wab">'+(inb?'<div class="wan">'+esc(m.from||c.name)+'</div>':'')+(m.file?'<div class="wafile">📎 '+esc(m.file)+'</div>':'')+'<div>'+esc(m.text)+'</div><div class="wat">'+esc(fmtHM(pd(m.date)))+' '+tick+'</div></div></div>';
  }

  return sep+'<div class="msg">'+avatar(who)+'<div class="mb"><div class="mh"><b>'+esc(who)+'</b> <span class="muted">'+esc(fmtDT(m.date))+'</span></div><div>'+esc(m.text)+'</div>'+(m.file?'<div class="wafile">📎 '+esc(m.file)+'</div>':'')+(m.link?'<a data-a="aigo" data-n="billing:i_inv">'+tr('Voir','View')+'</a>':'')+'</div></div>';

  const e=$('#chin');const txt=((e&&e.value)||UI.draft||'').trim();const c=D.get('channel',UI.ch);if(!txt||!c)return;

  UI.draft='';UI.dpop=null;render();scrollThread();

    setTimeout(()=>{D.write('message',m.id,{ack:'delivered'},{silent:true});save();if(UI.ch===c.id&&R.app==='discuss')render()},900);

};

function startMeet(o){
  if(UI.meet){toast(tr('Une réunion est déjà en cours.','A meeting is already running.'));return}
  const c=D.get('channel',o.ch);if(!c)return;
  const invited=(o.invited||chMembers(c)).filter((x,i,a)=>a.indexOf(x)===i);
  const kind=o.kind||'video';
  const k=D.create('call',{conv:c.id,kind:kind,host:ST.me,title:o.title||'',start:isoDT(new Date()),state:'ongoing',parts:[ST.me]},{silent:true});
  const label=kind==='meeting'?tr('Réunion d’équipe','Team meeting')+(o.title?' : '+o.title:''):kind==='audio'?tr('Appel audio lancé','Audio call started'):tr('Appel vidéo lancé','Video call started');
  D.create('message',{channel:c.id,author:ST.me,text:label+' — '+D.name('employee',ST.me),date:isoDT(new Date()),call:k.id,read:true,dir:'out'},{silent:true});
  UI.meet={ch:c.id,callId:k.id,kind:kind,title:o.title||'',t0:Date.now(),mic:true,cam:false,share:false,hand:false,chat:false,msgs:[],invited:invited,joined:[ST.me],room:o.room||genRoom()};
  if(o.audience==='all'||kind==='meeting')D.all('employee').forEach(e=>{if(e.id!==ST.me&&ST.set.nt_calls!==false)ST.unread=(ST.unread||0)+0});
  // participants simulés : se connectent un par un
  invited.filter(x=>x!==ST.me).forEach((id,i)=>{_mjoin.push(setTimeout(()=>{if(UI.meet&&UI.meet.callId===k.id&&!UI.meet.joined.includes(id)&&(i%7!==5)){UI.meet.joined.push(id);render()}},1400+i*1100))});
  if(kind!=='audio'||true){try{const w=window.open(jitsiUrl(UI.meet.room,kind),'_blank','noopener');if(!w)UI.meet.blocked=true}catch(e){UI.meet.blocked=true}}

  _mtimer=setInterval(()=>{const e=$('#mtimer');if(e&&UI.meet)e.textContent=fmtDur(Date.now()-UI.meet.t0)},1000);

  save();render();
}
function endMeet(){
  const m=UI.meet;if(!m)return;

  const mins=Math.max(1,Math.round((Date.now()-m.t0)/60000));
  D.write('call',m.callId,{state:'done',mins:mins,parts:m.joined.slice(),note:m.msgs.length?m.msgs.map(x=>D.name('employee',x.who)+' : '+x.t).join('\n'):''},{silent:true});

}

/* Configuration → Pièces/billets : les coupures viennent du modèle coinval */
function syncDEN(){try{const l=D.all('coinval').filter(c=>c.active!==false&&+c.value>0).sort((a,b)=>(a.kind===b.kind?0:a.kind==='b'?-1:1)||b.value-a.value);if(l.length){DEN.length=0;l.forEach(c=>DEN.push([+c.value,c.kind]))}}catch(e){}}
/* FCFA : montants entiers uniquement (pas de centimes) */
const dk=x=>x[1]+x[0];
const denLabel=x=>(x[1]==='b'?tr('Billet ','Note '):tr('Pièce ','Coin '))+fmt(x[0]);
const denTotal=d=>sum(DEN,x=>(+d['d_'+dk(x)]||0)*x[0]);
const denDetail=d=>DEN.filter(x=>+d['d_'+dk(x)]>0).map(x=>(x[1]==='b'?'':'● ')+fmt(x[0])+' × '+(+d['d_'+dk(x)])).join(' · ');
function denPreset(F){
  if(F===25000)return {b5000:2,b2000:2,b1000:4,b500:2,c500:4,c100:30,c50:20};
  const o={};let n=F;DEN.filter(x=>x[0]<=5000).forEach(x=>{const c=Math.floor(n/x[0]);if(c>0){o[dk(x)]=c;n-=c*x[0]}});return o;
}
function changeHint(n){
  const parts=[];DEN.forEach(x=>{const c=Math.floor(n/x[0]);if(c>0){parts.push(c+' × '+fmt(x[0]));n-=c*x[0]}});return parts.join(' + ');
}

/* ---------- état matériel ---------- */
const DRW={port:null,writer:null,status:'sim',err:'',last:''};
async function drawerPulse(){
  if(DRW.writer){try{await DRW.writer.write(new Uint8Array([0x1B,0x70,0x00,0x19,0xFA]));DRW.last='hw';return 'hw'}catch(e){DRW.writer=null;DRW.port=null;DRW.status='sim';DRW.err=String(e&&e.message||e)}}
  DRW.last='sim';return 'sim';
}
let _dwarn=null;
function openDrawer(){
  UI.dopen=Date.now();drawerPulse().then(()=>{if(R.screen==='app')render()});
  clearTimeout(_dwarn);_dwarn=setTimeout(()=>{if(UI.dopen){toast(tr('⚠ Tiroir resté ouvert : pensez à le refermer.','⚠ Drawer left open: please close it.'));if(ST&&ST.auth)render()}},30000);
}
A['drawer-close']=()=>{UI.dopen=0;clearTimeout(_dwarn);render()};
A['drawer-connect']=async()=>{
  try{
    if(!navigator.serial)throw new Error('Web Serial indisponible');
    const port=await navigator.serial.requestPort();await port.open({baudRate:9600});
    DRW.port=port;DRW.writer=port.writable.getWriter();DRW.status='hw';DRW.err='';
    toast(tr('Tiroir connecté. Un test d’ouverture est envoyé.','Drawer connected. Sending an opening test.'));openDrawer();
  }catch(e){
    DRW.status='sim';DRW.err=String(e&&e.message||e);
    toast(tr('Branchement impossible depuis cette page : mode simulé conservé.','Cannot connect from this page: simulated mode kept.'));
  }
  render();
};

/* ---------- données de démonstration ---------- */
function seedDrawer(){
  const C=(m,v)=>D.create(m,v,{silent:true});
  const cfg=D.all('poscfg').find(c=>c.reg==='bar');if(!cfg)return;
  const y=addDays(new Date(),-1);const at=(h,m)=>{const d=new Date(y);d.setHours(h,m,0,0);return isoDT(d)};
  const prods=D.all('product').filter(p=>p.reg==='bar'&&p.pos!==false);if(!prods.length)return;
  const ses=C('possession',{cfg:cfg.id,user:ST.me,open:at(7,30),close:at(22,5),cash0:25000,state:'open'});
  logMove(ses.id,'open_float',25000,{date:at(7,30),reason:T('Comptage d’ouverture','Opening count'),counted:25000,detail:'5 000 × 2 · 2 000 × 2 · 1 000 × 4 · 500 × 2 · ● 500 × 4 · ● 100 × 30 · ● 50 × 20'});
  const mk=(i,h,mi,pay)=>{const p=prods[i%prods.length];const q=1+(i%2);const o=C('posorder',{session:ses.id,cfg:cfg.id,date:at(h,mi),pay:pay,state:'paid',reg:'bar',kstatus:'served',lines:[{product:p.id,qty:q,price:p.price}]});
    if(pay==='cash'){const g=Math.ceil(o.total/1000)*1000;logMove(ses.id,'sale',o.total,{date:at(h,mi),order:o.id,given:g,change:g-o.total,reason:o.ref})}return o};
  mk(0,8,10,'cash');mk(1,9,40,'om');mk(2,11,5,'cash');mk(3,13,20,'cash');mk(4,15,45,'momo');mk(5,17,30,'cash');
  logMove(ses.id,'out',-5000,{date:at(10,15),reason:T('Achat urgent (lait, glace…) : lait entier','Urgent purchase (milk, ice…): whole milk')});
  logMove(ses.id,'nosale',0,{date:at(12,2),reason:T('Ouverture manuelle','Manual opening')});
  logMove(ses.id,'in',10000,{date:at(14,0),reason:T('Apport de monnaie','Change top-up')});
  const exp=drawerBal(ses.id);const cnt=exp-500;
  logMove(ses.id,'close',0,{date:at(22,0),counted:cnt,reason:T('Comptage de clôture','Closing count')});
  logMove(ses.id,'adjust',-500,{date:at(22,1),reason:T('Écart constaté : erreur de monnaie','Gap found: change error')});
  logMove(ses.id,'deposit',-(cnt-25000),{date:at(22,3),reason:T('Versement coffre / banque à la clôture','Safe / bank deposit at closing')});
  D.write('possession',ses.id,{state:'closed',cash_cnt:cnt,cash_diff:-500},{silent:true});
  ST.seedC=1;
}

/* ---------- ticket de préparation ---------- */
const fold=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7e\n]/g,'?');
function ticketText(o,d,pr){
  const w=pr&&pr.paper==='58'?32:42;const ctr=s=>' '.repeat(Math.max(0,Math.floor((w-s.length)/2)))+s;
  const ln=(a,b)=>{a=String(a);b=String(b||'');return a+' '.repeat(Math.max(1,w-a.length-b.length))+b};
  const p=o.partner?D.name('partner',o.partner):tr('Client de passage','Walk-in');
  const L=['='.repeat(w),ctr('VÉLUME'),ctr((d?tx(d.name):tr('CUISINE / BAR','KITCHEN / BAR')).toUpperCase()),'='.repeat(w),ln(o.ref,(o.date||'').slice(11,16)),ln(tr('Client','Customer'),p),'-'.repeat(w)];
  dispLines(o,d).forEach(l=>{L.push(ln(l.qty+' x '+tx(D.name('product',l.product)),''))});
  L.push('-'.repeat(w),ln(tr('Imprimé à ','Printed at '),isoDT(new Date()).slice(11,16)),'='.repeat(w));
  return L.join('\n');
}
const PRN={};
function serialBytes(text,pr){
  const enc=new TextEncoder();const parts=[new Uint8Array([0x1B,0x40]),enc.encode(fold(text)+'\n\n\n')];
  if(pr.cut)parts.push(new Uint8Array([0x1D,0x56,0x42,0x00]));
  const n=parts.reduce((a,p)=>a+p.length,0);const out=new Uint8Array(n);let i=0;parts.forEach(p=>{out.set(p,i);i+=p.length});return out;
}
function browserPrint(text,pr){
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const w=pr&&pr.paper==='58'?'58mm':'80mm';
  f.srcdoc='<style>@page{size:'+w+' auto;margin:2mm}body{margin:0}pre{font:12px/1.3 monospace;margin:0;width:'+w+'}</style><pre>'+esc(text)+'</pre>';
  f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast(tr('Impression bloquée par le navigateur.','Printing blocked by the browser.'))}setTimeout(()=>f.remove(),5000)};
}
function logJob(pr,o,d,mode,note){return D.create('printjob',{printer:pr&&pr.id,display:d&&d.id,order:o.id,mode:mode,note:note||''},{silent:true})}
/* envoie un ticket : retourne 'sent' (matériel) ou 'preview' */
async function sendTicket(o,d,pr,interactive){
  const text=ticketText(o,d,pr);
  if(pr.kind==='usb'&&PRN[pr.id]){
    try{for(let i=0;i<Math.max(1,pr.copies||1);i++)await PRN[pr.id].writer.write(serialBytes(text,pr));logJob(pr,o,d,'sent','ESC/POS');return 'sent'}
    catch(e){delete PRN[pr.id];logJob(pr,o,d,'preview',String(e&&e.message||e));return 'preview'}
  }
  if(pr.kind==='browser'&&interactive){browserPrint(text,pr);logJob(pr,o,d,'sent',tr('Boîte d’impression du navigateur','Browser print dialog'));return 'sent'}
  logJob(pr,o,d,'preview',pr.kind==='lan'?tr('Impression réseau : relais requis','Network printing: relay required'):tr('Imprimante non connectée','Printer not connected'));
  return 'preview';
}
A['printer-connect']=async el=>{
  const id=+(el&&el.dataset&&el.dataset.id||(FV&&FV.id));const pr=D.get('posprinter',id);
  try{

    const port=await navigator.serial.requestPort();await port.open({baudRate:9600});
    PRN[id]={port:port,writer:port.writable.getWriter()};toast(tr('Imprimante connectée : ','Printer connected: ')+pr.name);
  }catch(e){toast(tr('Connexion impossible depuis cette page (accès matériel bloqué). Mode aperçu conservé.','Cannot connect from this page (hardware access blocked). Preview mode kept.'))}
  render();
};

function makeBillFromFile(f){
  const v=D.all('partner').find(p=>p.kind==='supplier');

  goTo('billing','inv_in',r.id);
}

const letter=n=>{let s='';n=n+1;while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s};
function ledgerEntries(){
  const out=[];
  D.all('invoice').filter(i=>i.state==='posted'||i.state==='paid').forEach(i=>{
    const cust=i.kind.indexOf('out_')===0;const isRef=/refund/.test(i.kind);
    const deb=(cust&&!isRef)||(!cust&&isRef);
    out.push({p:i.partner,date:i.date,due:i.due,j:D.name('journal',i.journal)||(cust?tr('Ventes','Sales'):tr('Achats','Purchases')),acct:cust?'411000':'401000',ref:i.number,deb:deb?i.ttc:0,cred:deb?0:i.ttc,let:i.state==='paid'?letter(i.id):''});
  });
  D.all('payment').forEach(p=>{const inv=p.inv&&D.get('invoice',p.inv);const cust=p.dir==='in';
    out.push({p:p.partner,date:p.date,due:'',j:selLabel(M.payment.f.method,p.method),acct:cust?'411000':'401000',ref:p.ref,deb:cust?0:p.amount,cred:cust?p.amount:0,let:inv&&inv.state==='paid'?letter(inv.id):''})});
  return out;
}
CUSTOM.gl=function(){
  const g=UI.gl=UI.gl||{year:String(new Date().getFullYear()),acct:'all',partner:0,open:{}};
  const all=ledgerEntries();
  const years=uniq(all.map(e=>(e.date||'').slice(0,4)).concat([g.year])).filter(Boolean).sort();
  let es=all.filter(e=>(e.date||'').slice(0,4)===g.year&&(g.acct==='all'||e.acct===g.acct)&&(!g.partner||e.p===g.partner));
  const ps=uniq(es.map(e=>e.p)).filter(Boolean).sort((a,b)=>D.name('partner',a)<D.name('partner',b)?-1:1);
  const rowsH=ps.map(p=>{
    const l=es.filter(e=>e.p===p).sort((a,b)=>a.date<b.date?-1:1);const d=sum(l,e=>e.deb),c=sum(l,e=>e.cred);const open=g.open[p];

/* ---------- Déclaration de TVA ---------- */
CUSTOM.vatrep=function(){
  const v=UI.vat=UI.vat||{month:iso(new Date()).slice(0,7)};
  const inM=s=>(s||'').slice(0,7)===v.month;
  const I=D.all('invoice').filter(i=>(i.state==='posted'||i.state==='paid')&&inM(i.date));
  const sg=k=>(/refund/.test(k)?-1:1);
  const col=sum(I.filter(i=>i.kind.indexOf('out_')===0),i=>sg(i.kind)*i.tva),colB=sum(I.filter(i=>i.kind.indexOf('out_')===0),i=>sg(i.kind)*i.ht);
  const posO=D.all('posorder').filter(o=>o.state!=='cancel'&&o.state!=='draft'&&inM(o.date));
  const posT=sum(posO,o=>o.total),posH=sum(posO,o=>htOf(o.total));
  const ded=sum(I.filter(i=>i.kind.indexOf('in_')===0),i=>sg(i.kind)*i.tva),dedB=sum(I.filter(i=>i.kind.indexOf('in_')===0),i=>sg(i.kind)*i.ht);
  const due=col+(posT-posH)-ded;
  const months=Array.from({length:12},(_,i)=>{const d=new Date();d.setMonth(d.getMonth()-i,1);return iso(d).slice(0,7)});
  const row=(l,b,t,cls)=>'<tr'+(cls?' class="t"':'')+'><td>'+l+'</td><td class="num r">'+money(b)+'</td><td class="num r">'+money(t)+'</td></tr>';
  return pageHead(tr('Déclaration de TVA','VAT return'),'<button class="btn" data-a="print-page">'+tr('Imprimer','Print')+'</button>')+'<div class="va gut"><div class="rbar"><select data-a="vat-m">'+months.map(m=>'<option'+(m===v.month?' selected':'')+'>'+m+'</option>').join('')+'</select><span class="badge">TVA '+fmt2(TVA())+' %</span></div><div class="vwrap"><div class="scrollx"><table class="pv"><thead><tr><th></th><th>'+tr('Base HT','Base (excl.)')+'</th><th>TVA</th></tr></thead><tbody>'+
    row(tr('Ventes facturées (clients)','Invoiced sales (customers)'),colB,col)+row(tr('Ventes du Point de vente','Point-of-sale sales')+' ('+posO.length+')',posH,posT-posH)+row(tr('TVA collectée','Output VAT'),colB+posH,col+posT-posH,1)+
    row(tr('Achats (factures fournisseurs)','Purchases (vendor bills)'),dedB,ded)+row(tr('TVA déductible','Input VAT'),dedB,ded,1)+row(due>=0?tr('TVA à payer','VAT payable'):tr('Crédit de TVA','VAT credit'),0,Math.abs(due),1)+'</tbody></table></div></div><p class="muted" style="margin-top:10px;font-size:.88rem">'+tr('Récapitulatif indicatif calculé depuis vos factures comptabilisées et vos ventes en caisse. À vérifier avec votre comptable avant toute déclaration.','Indicative summary computed from your posted invoices and POS sales. Check with your accountant before filing.')+'</p></div>';
};

/* ---------- Analyse de trésorerie ---------- */
CUSTOM.cashflow=function(){
  const ms=Array.from({length:9},(_,i)=>{const d=new Date();d.setMonth(d.getMonth()-5+i,1);return d});const cur=iso(new Date()).slice(0,7);
  const key=d=>iso(d).slice(0,7);const I=D.all('invoice'),P=D.all('payment'),O=D.all('posorder').filter(o=>o.state!=='cancel'&&o.state!=='draft');
  const inn=ms.map(d=>{const k=key(d);return k<=cur?sum(P.filter(p=>p.dir==='in'&&(p.date||'').slice(0,7)===k),p=>p.amount)+sum(O.filter(o=>(o.date||'').slice(0,7)===k),o=>o.total):sum(I.filter(i=>i.kind==='out_invoice'&&i.state==='posted'&&(i.due||'').slice(0,7)===k),i=>i.ttc)});
  const outn=ms.map(d=>{const k=key(d);return k<=cur?sum(P.filter(p=>p.dir==='out'&&(p.date||'').slice(0,7)===k),p=>p.amount):sum(I.filter(i=>i.kind==='in_invoice'&&i.state==='posted'&&(i.due||'').slice(0,7)===k),i=>i.ttc)});
  const data={cats:ms.map(d=>({key:key(d),label:monthName(d,'short')+(key(d)>cur?' *':'')})),series:[{key:'in',label:tr('Encaissements','Cash in'),values:inn},{key:'out',label:tr('Décaissements','Cash out'),values:outn}]};
  return pageHead(tr('Analyse de trésorerie','Cashflow analysis'))+'<div class="va gut">'+chartBlock(tr('Encaissements et décaissements','Cash in and out'),'bar',data,v=>money(v),tr('* Mois à venir : prévision selon les échéances des factures comptabilisées. Mois passés : paiements enregistrés et ventes en caisse.','* Future months: forecast from posted invoice due dates. Past months: recorded payments and POS sales.'))+'</div>';
};

.ap2ok{font-size:.7rem;color:var(--good);font-weight:700}
.ap2list td,.ap2list th{white-space:normal}
.ap2list .ap2i{width:34px;height:34px;border-radius:8px}
.ap2list .ap2i svg{width:20px;height:20px}
.ap2info{display:flex;gap:16px;align-items:flex-start}
.ap2info .ap2i{width:72px;height:72px;border-radius:16px}
.ap2info .ap2i svg{width:40px;height:40px}
.ap2kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;margin-top:12px;font-size:.9rem}
.ap2kv span:nth-child(odd){color:var(--ink-2);font-weight:600}
.ap2seg{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:820px){.ap2side{display:flex;overflow-x:auto;gap:4px;align-items:center}.ap2side h4{display:none}.ap2side button{width:auto;flex:none;gap:8px}}

function itemHtml(it,sub){

CUSTOM.settings=function(m){
  const mid=m&&m.id||'st_gen';
  if(UI.stfrom!==mid){UI.stnav=(m&&m.app)||'general';UI.stfrom=mid;UI.stq=''}
  const cur=UI.stnav||'general';const q=(UI.stq||'').trim().toLowerCase();
  const navId=(cur==='dnotif'||cur==='dvoice')?'discuss':cur;
  const items=[['general',tr('Paramètres généraux','General settings'),'gear','var(--ink-2)']].concat(navApps().map(s=>{const ap=APPS.find(x=>x.id===s.app);return [s.id,L(s.l),s.icon,ap.color]}));
  const nav='<nav class="st3nav" aria-label="settings">'+items.map(x=>'<button data-a="st3-nav" data-s="'+x[0]+'" aria-current="'+(navId===x[0]&&!q)+'"><span style="color:'+x[3]+'">'+ic(x[2])+'</span>'+esc(x[1])+'</button>').join('')+'</nav>';
  const pool=q?[['general']].concat(navApps().map(s=>[s.id])).concat([['dnotif'],['dvoice']]).map(x=>x[0]):[cur];
  let out='';
  pool.forEach(id=>sections(id).forEach(sec=>{
    const cols=sec.c.map(c=>c.filter(it=>!q||textOf(it).includes(q)));
    if(!cols.some(c=>c.length))return;
    out+='<div class="st3bar">'+esc(lab(sec.t))+'</div><div class="st3cols"><div>'+cols[0].map(it=>itemHtml(it)).join('')+'</div><div>'+cols[1].map(it=>itemHtml(it)).join('')+'</div></div>';
  }));
  if(!out)out='<div class="emp"><h3>'+tr('Aucun paramètre trouvé','No setting found')+'</h3></div>';
  return '<div class="cp gut"><div class="cp-top"><div class="cp-left"><button class="btn pri" data-a="st3-save">'+tr('Enregistrer','Save')+'</button><button class="btn" data-a="st3-ign">'+tr('Ignorer','Discard')+'</button><span class="cp-title">'+tr('Paramètres','Settings')+'</span></div><div class="cp-search"><div class="sbox"><input id="st3q" data-fk="st3q" placeholder="'+tr('Rechercher...','Search...')+'" value="'+esc(UI.stq||'')+'" aria-label="search"></div></div></div></div><div class="va gut"><div class="st3">'+nav+'<div class="st3main">'+out+'</div></div></div>';
};

A['st3-save']=()=>{
  const d=UI.sd||{};const ks=Object.keys(d);let lang=null;
  ks.forEach(k=>{const v=d[k];if(k==='theme')ST.theme=v;else if(k==='dev')ST.dev=v;else if(k==='lang_default')lang=v;else ST.set[k]=v});
  UI.sd=null;save();
  if(lang&&lang!==ST.lang){setLang(lang);toast(tr('Paramètres enregistrés.','Settings saved.'));return}
  toast(ks.length?tr('Paramètres enregistrés et appliqués à toutes les applications.','Settings saved and applied to all apps.'):tr('Aucune modification.','No changes.'));render();
};
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||el.dataset.st3==null)return;
  UI.sd=UI.sd||{};const k=el.dataset.st3;
  if(el.type==='checkbox')UI.sd[k]=el.checked;else if(el.type==='radio')UI.sd[k]=el.dataset.v;else if(el.dataset.t==='num')UI.sd[k]=el.value===''?null:+el.value;else UI.sd[k]=el.value;
  if(el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT')render();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.st3!=null&&el.type!=='checkbox'&&el.type!=='radio'&&el.tagName!=='SELECT'){UI.sd=UI.sd||{};UI.sd[el.dataset.st3]=el.dataset.t==='num'?(el.value===''?null:+el.value):el.value}
  if(el.id==='st3q'){UI.stq=el.value;render()}
  if(el.id==='st3inv')UI.sinv=el.value;
});
A['st3-invite']=()=>{
  const e=(UI.sinv||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return toast(tr('Adresse e-mail invalide.','Invalid email address.'));
  if(D.all('user').some(u=>(u.login||'').toLowerCase()===e))return toast(tr('Cet utilisateur existe déjà.','This user already exists.'));
  D.create('user',{name:e.split('@')[0],login:e,group:'user',lang:LANG,active:true},{silent:true});
  UI.sinv='';save();toast(tr('Invitation créée (aucun e-mail réel n’est envoyé dans cette version). Utilisateur ajouté.','Invitation created (no real email is sent in this version). User added.'));render();
};

async function raw(path,o){o=o||{};const h=Object.assign({apikey:CFG.key,'Content-Type':'application/json'},o.headers||{});
  if(o.auth!==false&&SES&&SES.access_token)h.Authorization='Bearer '+SES.access_token; /* la clé publique ne va que dans l'en-tête apikey */
  const r=await fetch(CFG.url+path,{method:o.method||'GET',headers:h,body:o.body!==undefined?JSON.stringify(o.body):undefined});
  const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}
  return {ok:r.ok,status:r.status,json:j}}
const errText=r=>{const j=r&&r.json;return (j&&(j.msg||j.message||j.error_description||j.error))||('HTTP '+(r&&r.status))};
async function refresh(){if(!SES||!SES.refresh_token)return false;
  const r=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:SES.refresh_token},auth:false});
  if(r.ok&&r.json&&r.json.access_token){const n=normSes(r.json);if(!n.name)n.name=SES.name||'';saveSes(n,keepFlag());return true}
  if(r.status>=400&&r.status<500){saveSes(null);return false}
  throw new Error('net')}
async function api(path,o){if(SES&&SES.expires_at<Date.now()){try{await refresh()}catch(e){}}
  let r=await raw(path,o);
  if(r.status===401&&SES){let ok=false;try{ok=await refresh()}catch(e){}if(ok)r=await raw(path,o)}
  return r}

function reserveSync(m,n){try{const x=new XMLHttpRequest();x.open('POST',CFG.url+'/rest/v1/rpc/reserve_ids',false);x.setRequestHeader('apikey',CFG.key);if(SES&&SES.access_token)x.setRequestHeader('Authorization','Bearer '+SES.access_token);x.setRequestHeader('Content-Type','application/json');x.send(JSON.stringify({m:m,n:n}));if(x.status===200){const v=parseInt(x.responseText,10);if(v>0)return v}}catch(e){}return null}
async function refill(m){const r=await sb.rpc('reserve_ids',{m:m,n:BLOCK});if(r.ok&&+r.json>0){const p=POOL[m];const s=+r.json;if(p&&p[0]<=p[1]&&p[1]+1===s)p[1]=s+BLOCK-1;else if(!p||p[0]>p[1])POOL[m]=[s,s+BLOCK-1];sj(K.pool,POOL)}}

const syncModels=()=>Object.keys(ST.db).filter(m=>m!=='user'&&m.indexOf('_chat_')!==0&&Array.isArray(ST.db[m]));
function scan(){const ch=[];
  for(const m of syncModels()){const sm=SNAP[m]||{};const seen={};
    for(const r of ST.db[m]){if(!r||r.id==null)continue;const h=hr(r);seen[r.id]=1;if(sm[r.id]!==h)ch.push({model:m,id:r.id,data:r,h:h})}
    for(const id in sm)if(!seen[id])ch.push({model:m,id:+id,del:true})}
  return ch}
const setSnap=(m,id,h)=>{const sm=SNAP[m]||(SNAP[m]={});if(h===null)delete sm[id];else sm[id]=h};
async function pushRecords(){const ch=scan();if(!ch.length)return 0;
  for(let i=0;i<ch.length;i+=150){const part=ch.slice(i,i+150);
    const r=await sb.upsert('records',part.map(c=>({model:c.model,id:c.id,data:c.del?{}:c.data,deleted:!!c.del})),'model,id');
    if(!r.ok)throw new Error(errText(r));
    part.forEach(c=>setSnap(c.model,c.id,c.del?null:c.h));saveSnap()}
  return ch.length}
function applyRows(rows,adopt){let n=0;
  for(const x of rows){const m=x.model;if(m==='user'||m.indexOf('_chat_')===0)continue;
    const arr=ST.db[m]||(ST.db[m]=[]);const i=arr.findIndex(r=>r.id===x.id);const sm=SNAP[m]||(SNAP[m]={});
    if(i>=0&&!adopt&&hr(arr[i])!==sm[x.id])continue; /* modification locale non envoyée : elle gagne */
    if(x.deleted){if(i>=0){arr.splice(i,1);n++}delete sm[x.id];continue}
    const d=x.data||{};if(d.id==null)d.id=x.id;
    if(i>=0){if(hr(arr[i])===hr(d)){sm[x.id]=hr(d);continue}arr[i]=d}else{arr.push(d);if(arr.length>1&&arr[arr.length-2].id>d.id)arr.sort((a,b)=>a.id-b.id)}
    sm[x.id]=hr(d);n++}
  return n}
async function pullRecords(full){let cur=full?null:lg(K.cur);let n=0;let guard=0;
  while(guard++<200){
    let q='select=model,id,data,deleted,updated_at&order=updated_at.asc&limit=1000';
    if(cur){const t=Date.parse(cur);q+='&updated_at=gt.'+enc(full||guard>1?cur:new Date((isNaN(t)?0:t)-4000).toISOString())}
    const r=await sb.select('records',q);if(!r.ok)throw new Error(errText(r));
    const rows=r.json||[];if(!rows.length)break;
    APPLYING=true;try{n+=applyRows(rows,!!full&&ADOPT)}finally{APPLYING=false}
    cur=rows[rows.length-1].updated_at;ls(K.cur,cur);
    if(rows.length<1000)break}
  saveSnap();return n}

function syncUsers(profiles){let changed=false;const us=ST.db.user||(ST.db.user=[]);const keep=[];

function setStatus(s,extra){const el=document.getElementById('vsync');if(!el)return;
  const m={ok:[tr('Synchronisé','Synced'),'ok'],sync:[tr('Synchronisation…','Syncing…'),'sync'],off:[tr('Hors connexion','Offline')+(extra?' · '+extra+' '+tr('en attente','pending'):''),'off'],err:[tr('Erreur de synchronisation','Sync error'),'err']}[s]||['',''];

function renderSoon(){if(rdT)return;rdT=setTimeout(function t(){rdT=null;const a=document.activeElement;const typing=a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable);if(typing||UI.modal||!ST.auth){if(ST.auth)rdT=setTimeout(t,2500);return}try{render()}catch(e){}},400)}
async function cycle(opt){opt=opt||{};if(!READY||!SES)return;if(SYNCING){AGAIN=true;return}SYNCING=true;let changed=false;
  try{setStatus('sync');
    const c1=await pullProfiles();if(!READY)return;
    const c2=await pullSettings(false);
    const c3=await pullRecords(false);
    await pushSettings();const pushed=await pushRecords();
    const c4=await pullInvites();
    changed=c1||c2||c3>0||c4;OFFLINE=false;setStatus('ok');
    if(changed){saveNow();renderSoon()}
  }catch(e){OFFLINE=!(e&&/HTTP 4|permission|row-level/i.test(String(e.message)));setStatus(OFFLINE?'off':'err',OFFLINE?scan().length:String(e.message))}
  finally{SYNCING=false;if(AGAIN){AGAIN=false;setTimeout(()=>cycle(),300)}}}

async function ownerCreate(w,session){ /* w : réponses de l'assistant ; session : déjà connecté (Google) */
  let p=null;
  if(!session){const r=await sb.signUp(nrm(w.email),w.code,w.name.trim());
    if(!r.ok)throw new Error(mapAuth(r));
    if(!r.json||!r.json.access_token)throw new Error(tr('Désactivez « Confirm email » dans Supabase (Authentication › Sign In / Providers › Email), puis réessayez.','Disable “Confirm email” in Supabase (Authentication › Sign In / Providers › Email), then try again.'));
    saveSes(normSes(r.json),true)}
  const rr=await sb.rpc('bootstrap_owner');
  if(!rr.ok){const m=rpcErr(rr);if(/already_initialized|existe déjà|already exists/.test(String(errText(rr))+m)){saveSes(null);throw new Error(tr('Une entreprise existe déjà sur ce serveur. Choisissez « Je suis employé » pour la rejoindre.','A business already exists on this server. Choose “I’m an employee” to join it.'))}throw new Error(m)}
  p=await getProfile();return p}
