<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* VÉLUME — layout: Odoo-style shell (home launcher, navbar with menus and systray, control panel, view area).
   Palette from the business plan (off-white, beige, wood, gold). Chart hues from a validated set. */
:root{
  --bg:#F7F4EC; --surface:#FFFDF8; --surface-2:#EFE8D8; --surface-3:#E7DEC9; --ink:#2B241B; --ink-2:#6A5E4E; --line:#E3D9C6; --line-2:#D6CAB2;
  --gold:#B2842F; --gold-ink:#7A5714; --gold-soft:#F3E4BD; --on-gold:#FFFDF8; --teal:#0F7C86;
  --good:#2F7D4F; --warn:#9A6410; --bad:#B63F32; --info:#2A78D6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --shadow:0 1px 2px rgba(60,40,10,.06),0 10px 28px rgba(60,40,10,.08);
  --fd:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16130F; --surface:#211C16; --surface-2:#2C261D; --surface-3:#372F24; --ink:#F2EBDC; --ink-2:#B5A890; --line:#3A3227; --line-2:#4A4032;
  --gold:#D7A94E; --gold-ink:#E8C47A; --gold-soft:#3A2E16; --on-gold:#1B1710; --teal:#4CC3CC;
  --good:#5DB583; --warn:#E0A73F; --bad:#E4776A; --info:#6AA6EE;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16130F; --surface:#211C16; --surface-2:#2C261D; --surface-3:#372F24; --ink:#F2EBDC; --ink-2:#B5A890; --line:#3A3227; --line-2:#4A4032;
  --gold:#D7A94E; --gold-ink:#E8C47A; --gold-soft:#3A2E16; --on-gold:#1B1710; --teal:#4CC3CC;
  --good:#5DB583; --warn:#E0A73F; --bad:#E4776A; --info:#6AA6EE;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14.5px;line-height:1.4;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:90}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:var(--fd);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.sp{flex:1}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor}
#app{min-height:100%;display:flex;flex-direction:column}

/* buttons / controls */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 13px;font-weight:600;min-height:36px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sec{background:var(--gold-soft);border-color:var(--gold-soft);color:var(--gold-ink)}
.btn.sm{min-height:30px;padding:3px 10px;font-size:.88rem}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;flex:none;position:relative}
.ib:hover{background:var(--surface-2)}
.ib.on{background:var(--surface-2);border-color:var(--line)}
.ib.bd{border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:8px;font-weight:600;color:var(--ink-2);min-height:30px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.good{color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--surface))}
.badge.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.badge.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.badge.info{color:var(--info);background:color-mix(in srgb,var(--info) 14%,var(--surface))}
.badge.gold{color:var(--gold-ink);background:var(--gold-soft)}
.tag{display:inline-block;padding:0 8px;border-radius:999px;font-size:.78rem;border:1px solid var(--line-2);background:var(--surface-2);margin-right:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--sc,var(--gold));flex:none}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:inline-grid;place-items:center;font-weight:700;font-size:.8rem;flex:none;position:relative}
.avatar.sm{width:22px;height:22px;font-size:.65rem}
.avatar.lg{width:56px;height:56px;font-size:1.2rem}
.avatar .on{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;background:var(--good);border:2px solid var(--surface)}
.notice{border:1px dashed var(--gold);background:var(--gold-soft);border-radius:10px;padding:9px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center}

/* navbar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--surface);border-bottom:1px solid var(--line);height:48px;display:flex;align-items:center;gap:4px;flex:none}
.nav .gut{display:flex;align-items:center;gap:4px;width:100%;height:100%}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:700;letter-spacing:.2em;font-size:1rem;color:var(--ink);text-decoration:none;margin-right:6px}
.brand:hover{text-decoration:none}
.brand-mark{width:20px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-soft));box-shadow:0 0 12px var(--gold)}
.appname{font-weight:700;padding:0 8px;white-space:nowrap}
.menus{display:flex;align-items:center;gap:0;min-width:0}
.mi{position:relative}
.mi>button{border:0;background:transparent;padding:0 11px;height:48px;font-weight:500;white-space:nowrap}
.mi>button:hover,.mi>button.open{background:var(--surface-2)}
.mi>button.cur{font-weight:700}
.dd{position:absolute;top:100%;left:0;min-width:210px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;z-index:70;max-height:70vh;overflow:auto}
.dd.r{left:auto;right:0}
.dd button,.dd .ddh{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;border-radius:7px;gap:8px;align-items:center}
.dd button:hover{background:var(--surface-2)}
.dd .ddh{font-size:.78rem;color:var(--ink-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:10px}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.systray{display:flex;align-items:center;gap:2px;margin-left:auto}
.systray .co{padding:0 8px;font-weight:500}
.cnt{position:absolute;top:1px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 4px;font-weight:700}
.burger{display:none}
@media (max-width:820px){.menus{display:none}.burger{display:inline-grid}.systray .co{display:none}.appname{padding:0 4px}}

/* home */
.home{flex:1;background:var(--bg) radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px;padding-block:20px 60px}
.home .wrap{max-width:1100px;margin:0 auto}
.apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:26px 12px;margin-top:22px}
.apptile{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:9px;font-weight:500;color:var(--ink);padding:4px}
.apptile .ai{width:84px;height:84px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 1px 2px rgba(60,40,10,.05);display:grid;place-items:center;color:var(--k);transition:transform .12s}
.apptile:hover .ai{transform:translateY(-3px);box-shadow:var(--shadow)}
.apptile .ai svg{width:42px;height:42px;stroke-width:1.5;fill:color-mix(in srgb,var(--k) 18%,transparent)}
.apptile .lb{text-align:center;line-height:1.2}
.trial{margin-top:6px}

/* control panel */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.cp{padding-top:12px;padding-bottom:6px}
.cp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cp-left{display:flex;align-items:center;gap:8px;min-width:0}
.cp-title{font-size:1.1rem;font-family:var(--fd);font-weight:600;white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0}
.crumbs a,.crumbs button.cl{color:var(--teal);font-weight:600;border:0;background:transparent;padding:0}
.crumbs .cur{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-search{flex:1 1 280px;max-width:640px;margin:0 auto;position:relative}
.sbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:0 6px 0 12px;min-height:36px;flex-wrap:wrap}
.sbox:focus-within{border-color:var(--teal)}
.sbox input{border:0;background:transparent;outline:0;flex:1;min-width:80px;padding:6px 0}
.facet{display:inline-flex;align-items:stretch;border-radius:6px;overflow:hidden;background:var(--surface-2);font-size:.88rem;height:24px}
.facet .fi{background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;padding:0 6px}
.facet .fi svg{width:14px;height:14px}
.facet .ft{padding:0 7px;display:flex;align-items:center}
.facet button{border:0;background:transparent;padding:0 6px;color:var(--ink-2)}
.sdd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;z-index:50;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.sdd h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);margin-bottom:6px}
.sdd button{display:flex;width:100%;border:0;background:transparent;text-align:left;padding:5px 6px;border-radius:6px;gap:8px;align-items:center}
.sdd button:hover{background:var(--surface-2)}
.sdd button .ck{width:14px;color:var(--teal)}
.cp-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.pager{display:flex;align-items:center;gap:2px;font-variant-numeric:tabular-nums;font-size:.9rem}
.viewsw{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;gap:1px}
.viewsw .ib{width:32px;height:30px;border-radius:6px}
.cp-bottom{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.counter{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 14px;min-width:96px;text-align:center;font-weight:600}
.counter b{display:block;font-size:1.15rem;font-family:var(--fd)}
.counter[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
@media (max-width:760px){.cp-search{order:3;flex-basis:100%;max-width:none}.cp-right{margin-left:auto}}

/* view area */
.va{flex:1;padding-block:8px 70px;min-width:0;position:relative}
.vwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scrollx{overflow-x:auto}

/* list */
table.lv{border-collapse:collapse;width:100%}
.lv th,.lv td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.lv th{font-size:.84rem;color:var(--ink-2);font-weight:700;background:var(--surface);position:sticky;top:0;user-select:none}
.lv th.sort{cursor:pointer}
.lv td.w{white-space:normal;min-width:180px}
.lv tr.rw{cursor:pointer}
.lv tr.rw:hover td{background:var(--surface-2)}
.lv td.r,.lv th.r{text-align:right}
.lv .chk{width:34px;padding-right:0}
.lv tr.grp td{background:var(--surface-2);font-weight:700;cursor:pointer}
.lv tr.add td{color:var(--teal);font-weight:600;cursor:pointer}
.lv tfoot td{font-weight:700;background:var(--surface-2)}
input[type=checkbox]{accent-color:var(--gold);width:16px;height:16px}

/* kanban */
.kv{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}
.kcol{flex:0 0 min(78vw,290px);min-width:0}
.kcol.fold{flex-basis:44px}
.kh{display:flex;align-items:center;gap:6px;padding:4px 2px}
.kh h3{flex:1;font-size:1rem}
.kprog{height:5px;border-radius:3px;background:var(--surface-3);margin:4px 2px 10px;overflow:hidden}
.kprog i{display:block;height:100%;background:var(--teal)}
.kcards{display:grid;gap:8px;min-height:60px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:grid;gap:6px;min-width:0}
.kcard:hover{border-color:var(--gold)}
.kcard.drag{opacity:.4}
.kcol.over .kcards{outline:2px dashed var(--gold);outline-offset:3px;border-radius:8px}
.kflat{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.kq{display:flex;gap:6px}
.kq input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:8px;padding:6px 9px;background:var(--surface)}
.stars{display:inline-flex;gap:1px;color:var(--line-2)}
.stars .on{color:var(--gold)}

/* calendar */
.calw{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
@media (max-width:980px){.calw{grid-template-columns:minmax(0,1fr)}.calw .calside{order:-1;display:none}.calw.showside .calside{display:block}}
.calscroll{overflow:auto;max-height:calc(100vh - 230px);min-height:420px;background:var(--surface)}
.cal{min-width:760px}
.calhead,.calbody{display:grid;grid-template-columns:52px repeat(var(--nd,7),minmax(0,1fr))}
.calhead{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:4}
.calhead>div{padding:6px 4px;text-align:center;font-size:.8rem;color:var(--ink-2)}
.calhead .dn{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:15px;font-weight:700;color:var(--ink);font-size:1rem}
.calhead .today .dn{background:var(--bad);color:#fff}
.hours{position:sticky;left:0;background:var(--surface);z-index:3;border-right:1px solid var(--line)}
.hours div{height:48px;font-size:.72rem;color:var(--ink-2);text-align:right;padding:0 6px;transform:translateY(-7px)}
.dcol{position:relative;height:calc(var(--nh,18)*48px);border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 47px,var(--line) 47px 48px);cursor:cell}
.dcol.today{background-color:color-mix(in srgb,var(--gold) 6%,transparent)}
.ev{position:absolute;border:0;border-left:3px solid var(--sc);background:color-mix(in srgb,var(--sc) 20%,var(--surface));border-radius:6px;padding:2px 5px;font-size:.72rem;line-height:1.2;text-align:left;overflow:hidden;color:var(--ink);cursor:pointer}
.ev b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mon{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mon .dh{padding:6px;text-align:center;font-size:.8rem;color:var(--ink-2);border-bottom:1px solid var(--line)}
.mon .dc{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:2px;cursor:cell;min-width:0}
.mon .dc.out{background:var(--surface-2);opacity:.65}
.mon .dc.we{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.mon .dc .d{font-size:.8rem;color:var(--ink-2);padding:0 3px}
.mon .dc.today .d{background:var(--bad);color:#fff;border-radius:11px;display:inline-block;min-width:22px;text-align:center;padding:0 4px;align-self:flex-start}
.mon .me{border:0;border-left:3px solid var(--sc);background:color-mix(in srgb,var(--sc) 20%,var(--surface));border-radius:4px;font-size:.72rem;padding:1px 4px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;width:100%}
.calside .mini{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.mini .mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-weight:700}
.mini .mg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:.82rem}
.mini .mg b{color:var(--ink-2);font-weight:700;padding:3px 0}
.mini .mg button{border:0;background:transparent;height:30px;border-radius:15px;color:var(--ink)}
.mini .mg button.out{color:var(--ink-2);opacity:.55}
.mini .mg button.sel{background:var(--surface-3)}
.mini .mg button.today{background:var(--bad);color:#fff}
.calside h4{margin:14px 0 6px;font-size:.95rem}
.calside label{display:flex;gap:8px;align-items:center;padding:3px 0}

/* gantt */
.gv{overflow:auto;background:var(--surface);max-height:calc(100vh - 230px);min-height:260px}
.gt{min-width:760px}
.gh{display:grid;grid-template-columns:200px 1fr;position:sticky;top:0;z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.gh .gl{padding:8px 12px;font-weight:700;border-right:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:5}
.gscale{display:grid;grid-template-columns:repeat(var(--nc),minmax(var(--cw,34px),1fr))}
.gscale .gm{grid-row:1;padding:4px 8px;font-size:.82rem;border-left:1px solid var(--line);color:var(--ink-2)}
.gscale .gd{grid-row:2;text-align:center;font-size:.78rem;padding:3px 0;border-left:1px solid var(--line);color:var(--ink-2)}
.gscale .gd.today{background:var(--gold-soft);color:var(--ink);font-weight:700;outline:1px solid var(--gold)}
.gscale .gd.we{background:var(--surface-2)}
.gr{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--line);min-height:44px}
.gr .gl{padding:10px 12px;border-right:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:2;overflow-wrap:anywhere}
.gr .gb{position:relative;background:repeating-linear-gradient(to right,transparent 0 calc(100%/var(--nc) - 1px),var(--line) calc(100%/var(--nc) - 1px) calc(100%/var(--nc)));min-height:44px}
.gbar{position:absolute;height:24px;border-radius:5px;background:var(--sc,var(--s2));color:#fff;font-size:.74rem;padding:3px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:0;text-align:left;cursor:pointer}
.gr.sub .gl{padding-left:26px;color:var(--ink-2)}

/* graph / pivot */
.gwrap{position:relative;padding:12px 14px 16px}
.gtool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 2px}
.gtool .sw{display:inline-flex;align-items:center;gap:7px}
.sw input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--surface-3);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw input::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:var(--good)}
.sw input:checked::after{left:16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--fb);font-size:12px;fill:var(--ink-2)}
.chart .tt{fill:var(--ink);font-weight:700}
.chart .gl line{stroke:var(--line);stroke-width:1}
.ghostchart{opacity:.28;pointer-events:none}
.skelg{opacity:.3;pointer-events:none;filter:saturate(.6)}
.ovl-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:20px;z-index:2}
.ovl-empty h3{font-size:1.25rem}
.pv{border-collapse:collapse;width:100%}
.pv th,.pv td{padding:7px 12px;border:1px solid var(--line);text-align:right}
.pv th:first-child,.pv td:first-child{text-align:left}
.pv thead th{background:var(--surface-2);cursor:pointer}
.pv tr.t td{font-weight:700;background:var(--surface-2)}

/* form */
.fv{max-width:1100px;margin:0 auto}
.fv-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.status{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.status span,.status button{padding:5px 12px;font-size:.85rem;border:0;border-right:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-weight:600}
.status .on{background:var(--gold);color:var(--on-gold)}
.status button:hover{background:var(--surface-2)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.ftitle{width:100%;border:0;border-bottom:1px solid transparent;background:transparent;font-family:var(--fd);font-weight:700;font-size:1.6rem;padding:2px 0;outline:0;margin-bottom:12px}
.ftitle:hover,.ftitle:focus{border-bottom-color:var(--line-2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:4px 36px}
.fr{display:grid;grid-template-columns:140px minmax(0,1fr);gap:8px;align-items:center;padding:4px 0;min-height:36px}
.fr>label{color:var(--ink-2);font-weight:600;font-size:.88rem}
.fr input:not([type=checkbox]),.fr select,.fr textarea{width:100%;border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:6px 2px;outline:0;border-radius:0}
.fr input:focus,.fr select:focus,.fr textarea:focus{border-bottom-color:var(--teal)}
.fr input:disabled,.fr select:disabled{color:var(--ink);opacity:.9;border-bottom-color:transparent}
.fr.full{grid-template-columns:1fr}
@media (max-width:560px){.fr{grid-template-columns:1fr;gap:0}}
.chatter{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.msg{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.msg:first-of-type{border-top:0}
.msg .mb{min-width:0}
.msg .mh{font-size:.85rem}
.msg .note{background:var(--surface-2);border-radius:8px;padding:6px 9px;margin-top:3px}

/* modal / popovers */
.ovl{position:fixed;inset:0;background:rgba(20,14,6,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.ovl{align-items:center}}
.dlg{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.dlg.wide{max-width:860px}
@media (min-width:700px){.dlg{border-radius:16px}}
.dlg header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.dlg footer{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.fld{display:grid;gap:5px;margin-bottom:12px}
.fld label{font-size:.85rem;font-weight:600;color:var(--ink-2)}
.fld input:not([type=checkbox]),.fld select,.fld textarea{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
.err{color:var(--bad);font-size:.88rem;margin-bottom:10px}
.pop{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pop.tr{top:calc(54px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:200;font-weight:600;max-width:calc(100% - 32px)}
.chatwin{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;width:min(400px,calc(100vw - 24px));height:min(560px,calc(100vh - 80px));z-index:85;display:flex;flex-direction:column;overflow:hidden}
.chatwin.big{width:min(760px,calc(100vw - 24px));height:calc(100vh - 80px)}
.cwh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}
.cwb{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:8px 12px;border-radius:14px;background:var(--surface-2);overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--gold);color:var(--on-gold)}
.sugg{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sugg button{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;text-align:left;font-weight:600}
.cwf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);align-items:center}
.cwf input{flex:1;min-width:0;border:1px solid var(--teal);border-radius:999px;padding:8px 14px;background:var(--surface)}

/* discuss */
.dsc{display:grid;grid-template-columns:76px 340px minmax(0,1fr);gap:12px;height:calc(100vh - 110px);min-height:420px}
.dsc.pop-embed{grid-template-columns:76px minmax(0,1fr);height:520px}
@media (max-width:900px){.dsc{grid-template-columns:64px minmax(0,1fr)}.dsc .thread{display:none}.dsc.openthread .list{display:none}.dsc.openthread .thread{display:flex}}
.rail{display:flex;flex-direction:column;gap:10px;padding-top:8px;align-items:center}
.rail button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;color:var(--ink);padding:6px 4px;border-radius:12px;width:62px;position:relative}
.rail button[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold-ink)}
.dsc .list{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px;min-width:0}
.thread{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.conv{display:flex;gap:10px;padding:8px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%;align-items:center}
.conv:hover,.conv.on{background:var(--surface-2)}
.conv .cm{min-width:0;flex:1}
.conv .cm b,.conv .cm span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.promo{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--teal) 14%,var(--surface));border-radius:12px;padding:10px 12px}
.promo .pt{flex:1;min-width:0}

/* knowledge */
.kn{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px;height:calc(100vh - 110px);min-height:460px}
@media (max-width:820px){.kn{grid-template-columns:minmax(0,1fr)}.kn .ksb{display:none}.kn.showsb .ksb{display:flex}.kn.showsb .kdoc{display:none}}
.ksb{display:flex;flex-direction:column;gap:6px;min-width:0}
.ksb .sec{font-size:.82rem;color:var(--ink-2);padding:10px 8px 2px}
.ksb .it{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:7px 10px;border-radius:8px;text-align:left;width:100%}
.ksb .it:hover{background:var(--surface-2)}
.ksb .it.on{background:color-mix(in srgb,var(--teal) 14%,var(--surface));color:var(--teal);font-weight:600}
.kdoc{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.kdh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.kbody{flex:1;overflow:auto;padding:26px max(18px,6%)}
.kbody .inner{max-width:760px;margin:0 auto}
.ktitle{font-family:var(--fd);font-weight:700;font-size:2.2rem;outline:0;border:0;background:transparent;width:100%;margin-bottom:6px}
.ked{outline:0;min-height:300px;line-height:1.6}
.ked h2{margin:22px 0 8px;font-size:1.4rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.ked ul{padding-left:22px}
.ked .cb{display:flex;gap:8px;align-items:center;margin:2px 0}
.ked mark{background:var(--gold-soft);color:var(--ink);padding:0 2px}
.ktool{display:flex;gap:4px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.ktool button{border:0;background:transparent;padding:4px 9px;border-radius:6px;font-weight:700}
.ktool button:hover{background:var(--surface)}

/* dashboards */
.db{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media (max-width:820px){.db{grid-template-columns:minmax(0,1fr)}.db .dbm{display:flex;overflow-x:auto;gap:4px}.db .dbm h4{display:none}}
.dbm h4{font-size:.85rem;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}
.dbm button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;border-radius:8px;white-space:nowrap}
.dbm button[aria-current="true"]{background:color-mix(in srgb,var(--teal) 14%,var(--surface));color:var(--teal);font-weight:700}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:0}
.kpi .l{color:var(--teal);font-weight:600;font-size:.88rem}
.kpi .v{font-family:var(--fd);font-weight:700;font-size:1.7rem;margin-top:2px;overflow-wrap:anywhere}
.kpi .d{font-size:.82rem;color:var(--ink-2)}
.kpi .d.up{color:var(--good)} .kpi .d.dn{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.leg{display:grid;gap:6px;margin-top:10px;font-size:.9rem}
.leg .lr{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:8px;align-items:center}

/* POS */
.posr{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.posr .ptop{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.posr .pbody{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
@media (max-width:920px){.posr .pbody{grid-template-columns:minmax(0,1fr)}.posr .pbody .ord{display:none}.posr .pbody.showord .ord{display:flex}.posr .pbody.showord .pcat{display:none}}
.pcat{overflow:auto;padding:12px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.pprod{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;min-height:112px}
.pprod:hover{border-color:var(--gold)}
.pprod .ph{height:52px;display:grid;place-items:center;color:var(--ink);background:color-mix(in srgb,var(--sc) 20%,var(--surface))}
.pprod .ph svg{width:26px;height:26px;color:var(--sc)}
.pprod .pn{font-weight:600;line-height:1.2;padding:8px 10px 0;flex:1}
.pprod .pp{color:var(--gold-ink);font-weight:700;padding:4px 10px 8px}
.ord{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ord .ol{flex:1;overflow:auto;padding:8px 14px}
.ol .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ol .line.on{background:var(--gold-soft)}
.ord .tt{padding:10px 14px;border-top:1px solid var(--line);font-family:var(--fd);font-weight:700;font-size:1.3rem;display:flex;justify-content:space-between}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 14px}
.pad button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:44px;font-weight:700}
.pad button:hover{background:var(--surface-2)}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px}
.payb{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:14px;font-weight:700;min-height:56px}
.payb:hover{border-color:var(--gold)}
.kds{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));align-items:start;padding:12px}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px}
.ticket.late{border-color:var(--bad)}

/* apps catalog / settings */
.appcat{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px}
@media (max-width:820px){.appcat{grid-template-columns:minmax(0,1fr)}.appcat .cats{display:flex;overflow-x:auto;gap:4px}}
.cats h4{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;color:var(--ink-2)}
.cats button{display:flex;width:100%;justify-content:space-between;border:0;background:transparent;padding:6px 10px;border-radius:8px;white-space:nowrap}
.cats button[aria-current="true"]{background:var(--surface-2);font-weight:700}
.appcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.appcard{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.appcard .ai2{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;color:var(--k);background:color-mix(in srgb,var(--k) 15%,var(--surface));flex:none}
.appcard .ai2 svg{width:26px;height:26px}
.appcard .am{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.appcard .am b{overflow-wrap:anywhere}
.appcard .am p{font-size:.82rem;color:var(--ink-2);line-height:1.3}
.appcard .ab{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.set{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px}
@media (max-width:820px){.set{grid-template-columns:minmax(0,1fr)}.set .sm{display:flex;overflow-x:auto;gap:4px}}
.sm button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:9px 12px;border-radius:8px;text-align:left;white-space:nowrap}
.sm button[aria-current="true"]{background:color-mix(in srgb,var(--teal) 14%,var(--surface));font-weight:700}
.sb{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sb>h3{background:var(--surface-2);padding:9px 20px;font-size:1rem}
.sb .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px 40px;padding:16px 24px}
.sb .so{display:grid;grid-template-columns:22px minmax(0,1fr);gap:2px 8px;align-items:start}
.sb .so b{font-weight:700}
.sb .so .sd{grid-column:2;color:var(--ink-2);font-size:.88rem}
.sb .so .sx{grid-column:2;display:grid;gap:4px;margin-top:4px}
.sb .so input[type=text],.sb .so select,.sb .so input[type=email]{border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:4px 0;outline:0;min-width:0;width:100%}
.sb .so.nochk{grid-template-columns:minmax(0,1fr)}
.sb .so.nochk .sd,.sb .so.nochk .sx{grid-column:1}
.sb a{cursor:pointer}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg) radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/22px 22px}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:26px 24px;width:min(360px,100%);box-shadow:var(--shadow);display:grid;gap:12px}
.lcard .lf{display:grid;gap:5px}
.lcard .lf .lh{display:flex;justify-content:space-between;font-size:.88rem}
.lcard input{border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%}
.lcard .btn{justify-content:center;width:100%}
.lcard .or{text-align:center;color:var(--ink-2);font-style:italic}

/* empty */
.emp{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:48px 20px}
.emp svg.big{width:120px;height:120px}
.emp h3{font-size:1.3rem}
.skel{display:grid;gap:10px;padding:14px}
.skel i{display:block;height:34px;border-radius:6px;background:var(--surface-3);opacity:.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* extras: form layout, tabs, chatter, totals, documents, till helpers */
.fwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:1180px){.fwrap{grid-template-columns:minmax(0,1fr) 360px}.fv{max-width:1280px}}
.fv-side .chatter{margin-top:0}
.smarts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:8px}
.smartb{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;color:var(--ink)}
.smartb:hover{background:var(--surface-2)}
.smartb span{display:flex;flex-direction:column;text-align:left;line-height:1.1}
.smartb small{color:var(--ink-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 12px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.totals{margin:14px 0 0 auto;max-width:340px;display:grid;gap:4px}
.totals>div{display:flex;justify-content:space-between;gap:20px}
.totals .big{font-family:var(--fd);font-size:1.25rem;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
table.lines input:not([type=checkbox]),table.lines select{border:0;border-bottom:1px solid var(--line-2);background:transparent;padding:5px 2px;width:100%;min-width:70px;outline:0}
table.lines td{padding:4px 8px;vertical-align:middle}
.ch-bar{display:flex;gap:6px;flex-wrap:wrap}
.ch-compose{margin:10px 0;display:grid;gap:6px}
.ch-compose textarea{border:1px solid var(--line-2);border-radius:8px;padding:8px;background:var(--bg);width:100%}

/* ===== Animations ===== */
@keyframes vUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes vFade{from{opacity:0}to{opacity:1}}
@keyframes vPop{0%{opacity:0;transform:scale(.88) translateY(8px)}70%{transform:scale(1.03)}100%{opacity:1;transform:none}}
@keyframes vSlideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes vGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes vPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}60%{box-shadow:0 0 0 7px rgba(192,57,43,0)}}
@keyframes vDrop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes vToast{0%{opacity:0;transform:translate(-50%,16px)}12%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:1}}
@keyframes vShine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes vFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes vRing{0%{box-shadow:0 0 0 0 rgba(37,160,90,.55)}100%{box-shadow:0 0 0 12px rgba(37,160,90,0)}}

#app[data-anim="1"] .kcard,#app[data-anim="1"] .kpi,#app[data-anim="1"] .card{animation:vUp .45s cubic-bezier(.2,.8,.2,1) both}
#app[data-anim="1"] .kcol:nth-child(2) .kcard,#app[data-anim="1"] .kpi:nth-child(2){animation-delay:.05s}
#app[data-anim="1"] .kcol:nth-child(3) .kcard,#app[data-anim="1"] .kpi:nth-child(3){animation-delay:.1s}
#app[data-anim="1"] .kcol:nth-child(4) .kcard,#app[data-anim="1"] .kpi:nth-child(4){animation-delay:.15s}
#app[data-anim="1"] table.lv tbody tr{animation:vFade .4s both}
#app[data-anim="1"] .kprog i,#app[data-anim="1"] .hbar i{transform-origin:left;animation:vGrow .8s cubic-bezier(.2,.8,.2,1) both .1s}
#app[data-anim="1"] .chart rect{transform-box:fill-box;transform-origin:bottom;animation:vGrowY .7s cubic-bezier(.2,.8,.2,1) both}
#app[data-anim="1"] .chart path{stroke-dasharray:2000;stroke-dashoffset:2000;animation:vDraw 1.2s ease forwards}
@keyframes vDraw{to{stroke-dashoffset:0}}
#app[data-anim="1"] .login .lcard{animation:vPop .6s both}
#app[data-am="1"] .dlg{animation:vSlideUp .32s cubic-bezier(.2,.8,.2,1) both}

const D={
  all:m=>ST.db[m]||(ST.db[m]=[]),
  get:(m,id)=>D.all(m).find(r=>r.id===id),
  nextId:m=>(ST.seq[m]=(ST.seq[m]||0)+1),
  name:(m,id)=>{const r=D.get(m,id);return r?rn(m,r):''},
  defaults(m){
    const o={};const F=fieldsOf(m);
    Object.keys(F).forEach(k=>{const f=F[k];if(f.def!==undefined)o[k]=typeof f.def==='function'?f.def():clone(f.def);else if(f.t==='bool')o[k]=false;else if(f.t==='m2m'||f.t==='lines')o[k]=[]});
    return o;
  },
  create(m,vals,opt){
    opt=opt||{};
    const rec=Object.assign({},D.defaults(m),vals||{});
    rec.id=vals&&vals.id?vals.id:D.nextId(m);
    if(vals&&vals.id&&vals.id>(ST.seq[m]||0))ST.seq[m]=vals.id;
    if(M[m].seqname&&M[m].seqfield&&!rec[M[m].seqfield]){rec[M[m].seqfield]=rec[M[m].seqfield]||M[m].seqname(rec)}
    if(M[m].compute)M[m].compute(rec);
    D.all(m).push(rec);
    if(!opt.silent){
      if(M[m].chatter!==false)logMsg(m,rec.id,tr('Création de '+L([M[m].fr,M[m].en]).toLowerCase(),'Created '+(M[m].en||M[m].fr).toLowerCase()),'log');
      runAutom('create',m,rec,null);
    }
    save();return rec;
  },
  write(m,id,vals,opt){
    opt=opt||{};
    const rec=D.get(m,id);if(!rec)return null;
    const old=clone(rec);
    Object.assign(rec,vals);
    if(M[m].compute)M[m].compute(rec);
    if(!opt.silent){
      const F=fieldsOf(m);
      Object.keys(vals).forEach(k=>{
        const f=F[k];if(!f||f.t==='lines'||f.t==='html'||old[k]===rec[k])return;
        if(f.track||f.t==='sel'&&k==M[m].status){
          logMsg(m,id,fl(f)+' : '+showVal(m,f,old[k])+' → '+showVal(m,f,rec[k]),'track');
        }
      });
      runAutom('write',m,rec,old);
    }
    save();return rec;
  },
  unlink(m,id){
    ST.db[m]=D.all(m).filter(r=>r.id!==id);
    delete ST.db['_chat_'+m+'_'+id];
    ST.acts=ST.acts.filter(a=>!(a.model===m&&a.rid===id));
    save();
  },
  dup(m,id){
    const r=D.get(m,id);if(!r)return null;
    const c=clone(r);delete c.id;
    if(M[m].seqfield)delete c[M[m].seqfield];
    c[M[m].rec]=(c[M[m].rec]||'')+(M[m].seqfield?'':' ('+tr('copie','copy')+')');
    return D.create(m,c);
  }
};

/* ---------- automation engine (server actions / automated actions) ---------- */
let _autoDepth=0;
function condOk(rule,rec,old){
  if(rule.trigger==='write'&&rule.field){
    if(old&&old[rule.field]===rec[rule.field])return false;
  }
  if(rule.field&&rule.op){
    const v=rec[rule.field];
    if(rule.op==='=')return String(v)===String(rule.val);
    if(rule.op==='!=')return String(v)!==String(rule.val);
    if(rule.op==='set')return v!=null&&v!==''&&v!==false;
    if(rule.op==='>')return +v>+rule.val;
  }
  return true;
}
const tpl=(s,rec,m)=>String(s||'').replace(/\{(\w+)\}/g,(x,k)=>{
  if(k==='name')return rn(m,rec);
  const f=M[m]&&M[m].f[k];if(f&&f.t==='m2o')return D.name(f.rel,rec[k]);
  return rec[k]==null?'':rec[k];
});
function runAutom(trig,m,rec,old){
  if(_autoDepth>2)return;
  const rules=D.all('autom').filter(r=>r.active&&r.model===m&&(r.trigger===trig||r.trigger==='both'));
  if(!rules.length)return;
  _autoDepth++;
  try{rules.forEach(r=>{
    if(!condOk(r,rec,old))return;
    r.runs=(r.runs||0)+1;
    (r.actions||[]).forEach(a=>execServer(a,m,rec));
  })}finally{_autoDepth--}
}
function execServer(a,m,rec){
  switch(a.type){
    case 'notify':postBot(tpl(a.text,rec,m),{model:m,id:rec.id});break;
    case 'activity':
      addActivity({model:m,rid:rec.id,type:a.atype||'todo',summary:tpl(a.text,rec,m),due:iso(addDays(new Date(),+a.days||0)),who:a.who||ST.me});break;
    case 'write':{const v={};v[a.field]=a.val;D.write(m,rec.id,v,{silent:true});break}
    case 'create':{
      const v={};Object.keys(a.vals||{}).forEach(k=>{const x=a.vals[k];v[k]=(typeof x==='string'&&x[0]==='{'&&x.slice(-1)==='}')?(rec[x.slice(1,-1)]):(typeof x==='string'?tpl(x,rec,m):x)});
      D.create(a.model,v);break}
    case 'email':logMsg(m,rec.id,tr('E-mail envoyé à ','E-mail sent to ')+(tpl(a.to,rec,m)||'—')+' — '+tpl(a.text,rec,m),'mail');break;
  }
}

}

/* ---------- RPC-style external interface (like Odoo XML-RPC / JSON-RPC) ---------- */
function domMatch(r,dom){
  return (dom||[]).every(c=>{
    if(!Array.isArray(c))return true;
    const f=c[0],op=c[1],v=c[2],x=r[f];
    switch(op){
      case '=':return x===v||String(x)===String(v);
      case '!=':return String(x)!==String(v);
      case '>':return x>v; case '<':return x<v; case '>=':return x>=v; case '<=':return x<=v;
      case 'in':return (v||[]).includes(x);
      case 'ilike':case 'like':return String(x==null?'':x).toLowerCase().includes(String(v).toLowerCase());
      default:return true;
    }
  });
}
const RPC={
  models:()=>Object.keys(M).map(k=>({model:k,name:M[k].fr,fields:Object.keys(fieldsOf(k)).length,count:D.all(k).length})),
  fields_get:m=>{const F=fieldsOf(m);return Object.keys(F).reduce((o,k)=>(o[k]={type:F[k].t,string:F[k].fr,relation:F[k].rel,required:!!F[k].req},o),{})},
  search:(m,dom,o)=>RPC.search_read(m,dom,['id'],o).map(r=>r.id),
  search_read:(m,dom,fields,o)=>{
    o=o||{};let a=D.all(m).filter(r=>domMatch(r,dom));
    if(o.order){const k=o.order.split(' ')[0],d=o.order.endsWith('desc')?-1:1;a=a.slice().sort((x,y)=>(x[k]>y[k]?1:x[k]<y[k]?-1:0)*d)}
    if(o.limit)a=a.slice(o.offset||0,(o.offset||0)+o.limit);
    return a.map(r=>{const c=clone(r);if(!fields||!fields.length)return c;const x={id:r.id};fields.forEach(f=>x[f]=c[f]);return x});
  },
  read:(m,ids,fields)=>RPC.search_read(m,[['id','in',ids]],fields),
  create:(m,v)=>D.create(m,v).id,
  write:(m,ids,v)=>{ids.forEach(i=>D.write(m,i,v));renderSoon();return true},
  unlink:(m,ids)=>{ids.forEach(i=>D.unlink(m,i));renderSoon();return true},
  search_count:(m,dom)=>D.all(m).filter(r=>domMatch(r,dom)).length,
  call(req){
    if(!M[req.model]&&req.method!=='models')throw new Error('Unknown model: '+req.model);
    const a=req.args||[];
    switch(req.method){
      case 'models':return RPC.models();
      case 'fields_get':return RPC.fields_get(req.model);
      case 'search':return RPC.search(req.model,a[0],a[1]);
      case 'search_read':return RPC.search_read(req.model,a[0],a[1],a[2]);
      case 'search_count':return RPC.search_count(req.model,a[0]);
      case 'read':return RPC.read(req.model,a[0],a[1]);
      case 'create':return RPC.create(req.model,a[0]);
      case 'write':return RPC.write(req.model,a[0],a[1]);
      case 'unlink':return RPC.unlink(req.model,a[0]);
      default:throw new Error('Unknown method: '+req.method);
    }
  }
};

/* ---------- search model (facets, filters, group-by) ---------- */
const VS={};   // per-action view state
function vstate(a){
  if(!VS[a.id])VS[a.id]={view:a.views[0],facets:[],page:0,sort:null,sortDir:1,sel:new Set(),cal:{mode:a.calMode||'week',date:iso(new Date())},
    graph:{type:(a.graph&&a.graph.type)||'bar',measure:a.graph&&a.graph.measure,by:a.graph&&a.graph.by,by2:a.graph&&a.graph.by2,stacked:true,desc:true},
    pivot:{row:a.pivot&&a.pivot.row,col:a.pivot&&a.pivot.col,measure:a.pivot&&a.pivot.measure},
    gantt:{scale:(a.gantt&&a.gantt.scale)||'month',date:iso(new Date()),group:a.gantt&&a.gantt.group},
    foldedCols:{},foldedGroups:{},cals:{}};
  return VS[a.id];
}
function applySearch(a,vs){
  const F=fieldsOf(a.model);let rows=D.all(a.model).slice();
  if(a.dom)rows=rows.filter(r=>a.dom(r));
  vs.facets.forEach(fc=>{
    if(fc.k==='text'){
      const q=fc.val.toLowerCase();const flds=fc.field?[fc.field]:(a.search||[M[a.model].rec]);
      rows=rows.filter(r=>flds.some(k=>F[k]&&rawVal(a.model,F[k],r).toLowerCase().includes(q)));
    }else if(fc.k==='filter'){
      const fi=(a.filters||[]).find(x=>x[0]===fc.id);if(fi)rows=rows.filter(r=>fi[2](r));
    }
  });
  if(vs.sort&&F[vs.sort]){
    const f=F[vs.sort];
    rows.sort((x,y)=>{
      let p=f.t==='m2o'?D.name(f.rel,x[f.k]):f.t==='sel'?selLabel(f,x[f.k]):x[f.k],q=f.t==='m2o'?D.name(f.rel,y[f.k]):f.t==='sel'?selLabel(f,y[f.k]):y[f.k];
      if(p==null)p='';if(q==null)q='';
      return (p>q?1:p<q?-1:0)*vs.sortDir;
    });
  }else if(a.order){
    rows.sort(a.order);
  }
  return rows;
}
const groupFields=(a,vs)=>vs.facets.filter(f=>f.k==='group').map(f=>f.field);
function groupKey(F,f,r){
  const k=f;const fd=F[k];const v=r[k];
  if(!fd)return ['—','—'];
  if(fd.t==='m2o')return [v==null?'':String(v),v==null?tr('Non défini','None'):D.name(fd.rel,v)];
  if(fd.t==='sel')return [v==null?'':String(v),v==null||v===''?tr('Non défini','None'):selLabel(fd,v)];
  if(fd.t==='bool')return [v?'1':'0',v?tr('Oui','Yes'):tr('Non','No')];
  if(fd.t==='date'||fd.t==='datetime'){const d=pd(v);return d?[iso(d).slice(0,7),monthName(d)+' '+d.getFullYear()]:['',tr('Non défini','None')]}
  return [v==null?'':String(v),v==null||v===''?tr('Non défini','None'):String(v)];
}
function groupRows(a,rows,fields){
  const F=fieldsOf(a.model);
  const f=fields[0];const fd=F[f];const map=new Map();
  rows.forEach(r=>{const g=groupKey(F,f,r);if(!map.has(g[0]))map.set(g[0],{key:g[0],label:g[1],rows:[]});map.get(g[0]).rows.push(r)});
  let out=[...map.values()];
  // order sel groups by option order, m2o by record order
  if(fd&&fd.t==='sel')out.sort((x,y)=>(fd.opts||[]).findIndex(o=>String(o[0])===x.key)-(fd.opts||[]).findIndex(o=>String(o[0])===y.key));
  else if(fd&&fd.t==='m2o')out.sort((x,y)=>(+x.key||1e9)-(+y.key||1e9));
  else out.sort((x,y)=>x.key>y.key?1:-1);
  return out;
}

function facetHtml(a,vs){
  return vs.facets.map((f,i)=>{
    let icon='search',txt='';
    const F=fieldsOf(a.model);
    if(f.k==='text'){icon='search';txt=(f.field&&F[f.field]?fl(F[f.field])+' : ':'')+esc(f.val)}
    else if(f.k==='filter'){icon='filter';const fi=(a.filters||[]).find(x=>x[0]===f.id);txt=fi?esc(L(fi[1])):''}
    else if(f.k==='group'){icon='list';txt=tr('Grouper par : ','Group by: ')+esc(F[f.field]?fl(F[f.field]):f.field)}
    else if(f.k==='fav'){icon='star';txt=esc(f.name)}
    return '<span class="facet"><span class="fi">'+ic(icon)+'</span><span class="ft">'+txt+'</span><button data-a="fdel" data-i="'+i+'" aria-label="'+tr('Retirer','Remove')+'">'+ic('x')+'</button></span>';
  }).join('');
}

/* ---------- action renderer ---------- */
function renderAction(a){
  if(R.rid!=null)return renderForm(a);
  const vs=vstate(a);
  if(!a.views.includes(vs.view))vs.view=a.views[0];
  const rows=applySearch(a,vs);
  let body='';
  switch(vs.view){
    case 'list':body=listView(a,rows,vs);break;
    case 'kanban':body=kanbanView(a,rows,vs);break;
    case 'calendar':body=calendarView(a,rows,vs);break;
    case 'gantt':body=ganttView(a,rows,vs);break;
    case 'graph':body=graphView(a,rows,vs);break;
    case 'pivot':body=pivotView(a,rows,vs);break;
    case 'activity':body=activityView(a,rows,vs);break;
  }
  return controlPanel(a,rows,vs)+'<div class="va gut">'+(a.banner?a.banner():'')+body+'</div>';
}

/* ---------- LIST ---------- */
function listCols(a){
  const F=fieldsOf(a.model);const cols=(a.list||[M[a.model].rec]).filter(k=>F[k]).slice();
  (ST.custom[a.model]||[]).forEach(c=>{if(!cols.includes(c.k))cols.push(c.k)});
  return cols.map(k=>F[k]);
}
function rowHtml(a,cols,r,vs){
  const m=a.model;
  return '<tr class="rw" data-a="open" data-id="'+r.id+'"><td class="chk"><input type="checkbox" data-a="sel" data-id="'+r.id+'" '+(vs.sel.has(r.id)?'checked':'')+' aria-label="select"></td>'+
    cols.map(f=>'<td class="'+((f.t==='money'||f.t==='int'||f.t==='float')?'r':'')+(f.wrap?' w':'')+'">'+cellHtml(m,f,r)+'</td>').join('')+'</tr>';
}
function listView(a,rows,vs){
  const cols=listCols(a);const m=a.model;
  const ps=a.pageSize||80;const gf=groupFields(a,vs);
  if(!rows.length&&a.noGhost){const hd='<tr><th class="chk"><input type="checkbox" disabled></th>'+cols.map(f=>'<th>'+esc(fl(f))+'</th>').join('')+'</tr>';return '<div class="vwrap"><div class="scrollx"><table class="lv"><thead>'+hd+'</thead></table></div><div style="padding:60px 0">'+emptyState(a,null,null,false)+'</div></div>'}
  if(!rows.length)return '<div class="vwrap" style="position:relative">'+ghostList()+'<div class="ovl-empty">'+emptyState(a)+'</div></div>';
  let head='<tr><th class="chk"><input type="checkbox" data-a="selall" aria-label="select all" '+(vs.sel.size&&vs.sel.size===rows.length?'checked':'')+'></th>'+
    cols.map(f=>'<th class="sort'+((f.t==='money'||f.t==='int'||f.t==='float')?' r':'')+'" data-a="sort" data-k="'+f.k+'">'+esc(fl(f))+(vs.sort===f.k?' '+(vs.sortDir>0?'▲':'▼'):'')+'</th>').join('')+'</tr>';
  let body='';
  const sums=(a.sum||[]).filter(k=>cols.some(c=>c.k===k));
  if(gf.length){
    groupRows(a,rows,gf).forEach(g=>{
      const folded=vs.foldedGroups[g.key];
      body+='<tr class="grp" data-a="grpt" data-key="'+esc(g.key)+'"><td></td><td colspan="'+(cols.length)+'">'+(folded?ic('chevR'):ic('chevD'))+' '+esc(g.label)+' ('+g.rows.length+')'+
        (sums.length?'<span class="muted" style="margin-left:14px">'+sums.map(k=>esc(fl(fieldsOf(m)[k]))+': '+fmt(sum(g.rows,r=>r[k]))).join(' · ')+'</span>':'')+'</td></tr>';
      if(!folded)g.rows.forEach(r=>body+=rowHtml(a,cols,r,vs));
    });
  }else{
    rows.slice(vs.page*ps,(vs.page+1)*ps).forEach(r=>body+=rowHtml(a,cols,r,vs));
  }
  if(canCreate(a))body+='<tr class="add" data-a="new"><td></td><td colspan="'+cols.length+'">'+tr('Ajouter une ligne','Add a line')+'</td></tr>';
  let foot='';
  if(sums.length)foot='<tfoot><tr><td></td>'+cols.map(f=>'<td class="'+((f.t==='money'||f.t==='int'||f.t==='float')?'r':'')+'">'+(sums.includes(f.k)?(f.t==='money'?money(sum(rows,r=>r[f.k])):fmt2(sum(rows,r=>r[f.k]))):'')+'</td>').join('')+'</tr></tfoot>';
  return '<div class="vwrap"><div class="scrollx"><table class="lv"><thead>'+head+'</thead><tbody>'+body+'</tbody>'+foot+'</table></div></div>';
}

/* ---------- KANBAN ---------- */
function kanbanCols(a,rows,spec){
  const F=fieldsOf(a.model);const fd=F[spec.by];
  if(!fd)return [];
  let cols=[];
  if(fd.t==='sel')cols=(fd.opts||[]).filter(o=>!(spec.hide||[]).includes(o[0])).map(o=>({key:o[0],label:LANG==='fr'?o[1]:o[2],tone:o[3],rows:[]}));
  else if(fd.t==='m2o'){
    const recs=D.all(fd.rel);cols=recs.map(r=>({key:r.id,label:rn(fd.rel,r),rows:[]}));
  }
  const byKey=new Map(cols.map(c=>[String(c.key),c]));
  rows.forEach(r=>{
    let c=byKey.get(String(r[spec.by]));
    if(!c){c={key:r[spec.by],label:tr('Non défini','None'),rows:[]};byKey.set(String(c.key),c);cols.push(c)}
    c.rows.push(r);
  });
  if(spec.skipEmpty)cols=cols.filter(c=>c.rows.length);
  return cols;
}
function defaultCard(a,r,spec){
  const F=fieldsOf(a.model);const m=a.model;
  const title=esc(rn(m,r));
  const subs=(spec.sub||[]).map(k=>{const f=F[k];if(!f)return '';const h=cellHtml(m,f,r);return h?'<div class="muted" style="font-size:.86rem">'+(spec.subLabels?esc(fl(f))+' : ':'')+h+'</div>':''}).join('');
  const tags=(spec.tags||[]).map(k=>F[k]?cellHtml(m,F[k],r):'').join('');
  const av=spec.avatar&&F[spec.avatar]?(r[spec.avatar]?avatar(D.name(F[spec.avatar].rel,r[spec.avatar]),'sm'):''):'';
  const st=spec.stars&&F[spec.stars]?stars(r[spec.stars]||0):'';
  const money_=spec.money&&F[spec.money]?'<b class="num">'+money(r[spec.money])+'</b>':'';
  return '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><b style="overflow-wrap:anywhere">'+title+'</b>'+money_+'</div>'+subs+(tags?'<div>'+tags+'</div>':'')+
    ((st||av)?'<div style="display:flex;justify-content:space-between;align-items:center">'+st+av+'</div>':'');
}
function kanbanView(a,rows,vs){
  const spec=a.kanban||{};const m=a.model;
  const card=r=>'<div class="kcard" draggable="true" data-a="open" data-id="'+r.id+'" data-drag="'+r.id+'"'+(spec.color?' style="border-left:4px solid '+spec.color(r)+'"':'')+'>'+(spec.card?spec.card(r):defaultCard(a,r,spec))+'</div>';
  if(!rows.length&&(!spec.by||a.empty))return emptyState(a);
  if(!spec.by)return '<div class="kflat'+(spec.flatCls?' '+spec.flatCls:'')+'">'+rows.map(card).join('')+(canCreate(a)?'<button class="kcard" data-a="new" style="place-items:center;color:var(--teal);border-style:dashed;min-height:90px">'+ic('plus')+' '+tr('Nouveau','New')+'</button>':'')+'</div>';
  const F=fieldsOf(m);const cols=kanbanCols(a,rows,spec);
  const total=rows.length;

function ganttRange(vs){

      const l=(Math.max(b.s,rg.s)-rg.s)/span*100,w=(Math.min(b.ve,rg.e)-Math.max(b.s,rg.s))/span*100;
      const col=sp.color?(typeof sp.color==='function'?sp.color(b.r):(F[sp.color]&&F[sp.color].t==='sel'?(TONE[selTone(F[sp.color],b.r[sp.color])]||pcol(0)):pcol(+b.r[sp.color]||0))):pcol(0);
      return '<button class="gbar" style="left:'+l+'%;width:'+Math.max(w,1.2)+'%;top:'+(7+b.l*30)+'px;--sc:'+col+'" data-a="open" data-id="'+b.r.id+'" title="'+esc((sp.title?sp.title(b.r):rn(a.model,b.r))+' · '+fmtDT(isoDT(b.s))+' → '+fmtDT(isoDT(b.e)))+'">'+esc(sp.title?sp.title(b.r):rn(a.model,b.r))+'</button>';

/* ---------- GRAPH ---------- */
function aggregate(a,rows,by,by2,measure){
  const F=fieldsOf(a.model);
  const cm=new Map();const sm=new Map();
  rows.forEach(r=>{
    const c=groupKey(F,by,r);const s=by2?groupKey(F,by2,r):['_','_'];
    if(!cm.has(c[0]))cm.set(c[0],c[1]);if(!sm.has(s[0]))sm.set(s[0],s[1]);
  });
  let ck=[...cm.keys()],sk=[...sm.keys()];
  const fd=F[by];
  if(fd&&fd.t==='sel')ck.sort((x,y)=>(fd.opts||[]).findIndex(o=>String(o[0])===x)-(fd.opts||[]).findIndex(o=>String(o[0])===y));
  else if(fd&&fd.t==='m2o')ck.sort((x,y)=>(+x||1e9)-(+y||1e9));
  else ck.sort();
  const fd2=by2&&F[by2];
  if(fd2&&fd2.t==='sel')sk.sort((x,y)=>(fd2.opts||[]).findIndex(o=>String(o[0])===x)-(fd2.opts||[]).findIndex(o=>String(o[0])===y));
  else sk.sort();
  const val=r=>measure==='__count'||!measure?1:(+r[measure]||0);
  const series=sk.map(k=>({key:k,label:sm.get(k),values:ck.map(c=>sum(rows.filter(r=>groupKey(F,by,r)[0]===c&&(!by2||groupKey(F,by2,r)[0]===k)),val))}));
  return {cats:ck.map(k=>({key:k,label:cm.get(k)})),series:series};
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function chartSvg(type,data,fmtV,stacked){
  const W=720,H=330,pl=64,pr=14,pt=14,pb=44;
  const cats=data.cats,series=data.series;
  if(type==='pie'){
    const tot=sum(cats.map((c,i)=>sum(series,s=>s.values[i])));
    if(!tot)return '';
    let ang=-Math.PI/2;const cx=W/2,cy=H/2,R_=130;
    const slices=cats.map((c,i)=>{
      const v=sum(series,s=>s.values[i]);const a2=v/tot*Math.PI*2;
      const x1=cx+R_*Math.cos(ang),y1=cy+R_*Math.sin(ang);ang+=a2;const x2=cx+R_*Math.cos(ang),y2=cy+R_*Math.sin(ang);
      const large=a2>Math.PI?1:0;
      if(cats.length===1)return '<circle cx="'+cx+'" cy="'+cy+'" r="'+R_+'" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" data-tt="'+esc(c.label+' : '+fmtV(v))+'"/>';
      return '<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+R_+','+R_+' 0 '+large+' 1 '+x2+','+y2+' Z" fill="var(--s'+(1+i%8)+')" stroke="var(--surface)" stroke-width="2" data-tt="'+esc(c.label+' : '+fmtV(v)+' ('+Math.round(v/tot*100)+'%)')+'"/>';
    });
    return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="chart">'+slices.join('')+'</svg>';
  }
  const tots=cats.map((c,i)=>stacked&&type==='bar'?sum(series,s=>s.values[i]):Math.max(0,...series.map(s=>s.values[i])));
  const mx=niceMax(Math.max(0,...tots));
  const iw=W-pl-pr,ih=H-pt-pb;
  const y=v=>pt+ih-(v/mx)*ih;
  let g='';
  for(let i=0;i<=4;i++){const v=mx/4*i;g+='<g class="gl"><line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'"/></g><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmtV(v,1)+'</text>'}
  const bw=iw/Math.max(1,cats.length);
  let marks='',labels='';
  cats.forEach((c,i)=>{
    const cx=pl+bw*i+bw/2;
    const lb=String(c.label);labels+='<text x="'+cx+'" y="'+(H-pb+18)+'" text-anchor="middle">'+esc(lb.length>(cats.length>8?7:14)?lb.slice(0,cats.length>8?6:13)+'…':lb)+'</text>';
    if(type==='bar'){
      if(stacked){
        let acc=0;
        series.forEach((s,si)=>{const v=s.values[i];if(!v)return;const y1=y(acc+v),y0=y(acc);acc+=v;const w=Math.min(bw*.62,64);
          marks+='<rect x="'+(cx-w/2)+'" y="'+y1+'" width="'+w+'" height="'+Math.max(1,y0-y1-1.5)+'" rx="2" fill="var(--s'+(1+si%8)+')" data-tt="'+esc(c.label+' · '+s.label+' : '+fmtV(v))+'"/>'});
      }else{
        const n=series.length;const w=Math.min(bw*.7/n,40);
        series.forEach((s,si)=>{const v=s.values[i];const x=cx-(n*w)/2+si*w;marks+='<rect x="'+x+'" y="'+y(v)+'" width="'+(w-2)+'" height="'+Math.max(0,y(0)-y(v))+'" rx="2" fill="var(--s'+(1+si%8)+')" data-tt="'+esc(c.label+' · '+s.label+' : '+fmtV(v))+'"/>'});
      }
    }
  });
  if(type==='line'){
    series.forEach((s,si)=>{
      const pts=s.values.map((v,i)=>[pl+bw*i+bw/2,y(v)]);
      marks+='<polyline fill="none" stroke="var(--s'+(1+si%8)+')" stroke-width="2" points="'+pts.map(p=>p.join(',')).join(' ')+'"/>';
      pts.forEach((p,i)=>{marks+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="var(--s'+(1+si%8)+')" stroke="var(--surface)" stroke-width="2" data-tt="'+esc(cats[i].label+' · '+s.label+' : '+fmtV(s.values[i]))+'"/>'});
    });
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="chart">'+g+marks+labels+'</svg>';
}
function legendHtml(type,data){
  if(type==='pie')return '<div class="leg">'+data.cats.map((c,i)=>{const v=sum(data.series,s=>s.values[i]);return '<div class="lr"><span class="dot" style="--sc:var(--s'+(1+i%8)+')"></span><span>'+esc(c.label)+'</span><span class="num">'+fmt2(v)+'</span></div>'}).join('')+'</div>';
  if(data.series.length<2)return '';
  return '<div class="leg" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+data.series.map((s,i)=>'<div style="display:flex;gap:7px;align-items:center"><span class="dot" style="--sc:var(--s'+(1+i%8)+')"></span>'+esc(s.label)+'</div>').join('')+'</div>';
}
function graphView(a,rows,vs){
  const sp=a.graph;const F=fieldsOf(a.model);const g=vs.graph;
  const measures=sp.measures||[['__count',['Nombre','Count']]];
  const dims=sp.dims||a.groups||[];
  const mf=g.measure&&g.measure!=='__count'&&F[g.measure];
  const fmtV=(v,compact)=>{if(mf&&mf.t==='money'){return compact?(v>=1e6?fmt2(v/1e6)+' M':v>=1e3?fmt(v/1e3)+' k':fmt(v)):money(v)}return compact?fmt2(v):fmt2(v)};
  const data=aggregate(a,rows,g.by,g.type==='pie'?null:g.by2,g.measure);
  if(g.desc&&data.series.length===1){const ix=data.cats.map((c,i)=>i).sort((x,y)=>data.series[0].values[y]-data.series[0].values[x]);if(g.type!=='line'){data.cats=ix.map(i=>data.cats[i]);data.series[0].values=ix.map(i=>data.series[0].values[i])}}
  const empty=!rows.length||!data.cats.length;
  const tool='<div class="gtool">'+
    '<div class="seg" role="group">'+[['bar','graph',tr('Barres','Bar')],['line','graph',tr('Courbe','Line')],['pie','pie',tr('Secteurs','Pie')]].map(x=>'<button data-a="gtype" data-t="'+x[0]+'" aria-pressed="'+(g.type===x[0])+'">'+x[2]+'</button>').join('')+'</div>'+
    '<select data-a="gmeasure" aria-label="'+tr('Mesure','Measure')+'">'+measures.map(m=>'<option value="'+m[0]+'"'+(g.measure===m[0]?' selected':'')+'>'+esc(L(m[1]))+'</option>').join('')+'</select>'+
    '<select data-a="gby" aria-label="'+tr('Grouper par','Group by')+'">'+dims.map(d=>'<option value="'+d+'"'+(g.by===d?' selected':'')+'>'+esc(F[d]?fl(F[d]):d)+'</option>').join('')+'</select>'+
    (g.type!=='pie'?'<select data-a="gby2" aria-label="'+tr('Série','Series')+'"><option value="">'+tr('— Aucune série —','— No series —')+'</option>'+dims.filter(d=>d!==g.by).map(d=>'<option value="'+d+'"'+(g.by2===d?' selected':'')+'>'+esc(F[d]?fl(F[d]):d)+'</option>').join('')+'</select>':'')+
    (g.type==='bar'&&data.series.length>1?'<label class="sw"><input type="checkbox" data-a="gstack" '+(g.stacked?'checked':'')+'> '+tr('Empilé','Stacked')+'</label>':'')+'</div>';
  if(empty){
    const ghost=chartSvg('bar',{cats:['a','b','c','d','e'].map(x=>({label:x})),series:[{label:'',values:[5,8,3,9,6]}]},v=>v,false);
    return '<div class="vwrap gwrap" style="position:relative">'+tool+'<div class="chart ghostchart">'+ghost+'</div><div class="ovl-empty"><h3>'+(a.empty?tr(a.empty[0],a.empty[1]):tr('Aucune donnée à afficher','No data to display'))+'</h3><p class="muted">'+(a.empty?tr(a.empty[2],a.empty[3]):tr('Modifiez les filtres ou créez des enregistrements.','Adjust the filters or create records.'))+'</p></div></div>';
  }
  const total=sum(data.series,s=>sum(s.values));
  return '<div class="vwrap gwrap">'+tool+'<div class="chart" data-chart>'+chartSvg(g.type,data,fmtV,g.stacked)+'</div>'+legendHtml(g.type,data)+
    '<p class="muted" style="margin-top:8px;font-size:.88rem">'+tr('Total : ','Total: ')+'<b class="num">'+(mf&&mf.t==='money'?money(total):fmt2(total))+'</b> · '+rows.length+' '+tr('enregistrements','records')+'</p></div>';
}

/* ---------- PIVOT ---------- */
function pivotView(a,rows,vs){
  const sp=a.pivot;const F=fieldsOf(a.model);const p=vs.pivot;
  const dims=sp.dims||a.groups||[];const measures=sp.measures||[['__count',['Nombre','Count']]];
  const mf=p.measure!=='__count'&&F[p.measure];
  const val=r=>p.measure==='__count'?1:(+r[p.measure]||0);
  const fv=v=>mf&&mf.t==='money'?money(v):fmt2(v);
  const sel=(k,list,cur,allowNone)=>'<select data-a="'+k+'">'+(allowNone?'<option value="">'+tr('— Total —','— Total —')+'</option>':'')+list.map(d=>'<option value="'+d+'"'+(cur===d?' selected':'')+'>'+esc(F[d]?fl(F[d]):d)+'</option>').join('')+'</select>';
  const tool='<div class="gtool"><span class="muted">'+tr('Lignes','Rows')+'</span>'+sel('prow',dims,p.row)+'<span class="muted">'+tr('Colonnes','Columns')+'</span>'+sel('pcol',dims,p.col,true)+
    '<span class="muted">'+tr('Mesure','Measure')+'</span><select data-a="pmeas">'+measures.map(m=>'<option value="'+m[0]+'"'+(p.measure===m[0]?' selected':'')+'>'+esc(L(m[1]))+'</option>').join('')+'</select></div>';
  if(!rows.length)return '<div class="vwrap gwrap">'+tool+emptyState(a,tr('Aucune donnée à afficher','No data to display'),'',false)+'</div>';
  const rk=new Map(),ck=new Map();
  rows.forEach(r=>{const g=groupKey(F,p.row,r);rk.set(g[0],g[1]);if(p.col){const c=groupKey(F,p.col,r);ck.set(c[0],c[1])}});
  const sortK=(map,f)=>{const fd=F[f];const k=[...map.keys()];if(fd&&fd.t==='sel')k.sort((x,y)=>(fd.opts||[]).findIndex(o=>String(o[0])===x)-(fd.opts||[]).findIndex(o=>String(o[0])===y));else if(fd&&fd.t==='m2o')k.sort((x,y)=>(+x||1e9)-(+y||1e9));else k.sort();return k};
  const rks=sortK(rk,p.row);const cks=p.col?sortK(ck,p.col):[];
  const cell=(rr,cc)=>sum(rows.filter(r=>(rr==null||groupKey(F,p.row,r)[0]===rr)&&(cc==null||!p.col||groupKey(F,p.col,r)[0]===cc)),val);
  let head='<thead><tr><th></th>'+(p.col?cks.map(c=>'<th>'+esc(ck.get(c))+'</th>').join(''):'')+'<th>'+(mf?esc(fl(mf)):tr('Nombre','Count'))+'</th></tr></thead>';
  let body='<tbody><tr class="t"><td>'+tr('Total','Total')+'</td>'+(p.col?cks.map(c=>'<td class="num">'+fv(cell(null,c))+'</td>').join(''):'')+'<td class="num">'+fv(cell(null,null))+'</td></tr>';
  rks.forEach(k=>{body+='<tr><td>'+esc(rk.get(k))+'</td>'+(p.col?cks.map(c=>'<td class="num">'+fv(cell(k,c))+'</td>').join(''):'')+'<td class="num"><b>'+fv(cell(k,null))+'</b></td></tr>'});
  body+='</tbody>';
  return '<div class="vwrap gwrap">'+tool+'<div class="scrollx"><table class="pv">'+head+body+'</table></div></div>';
}

/* ---------- ACTIVITY view ---------- */
function activityView(a,rows,vs){

/* =========================================================
   FORM
   ========================================================= */
function openForm(a,id,defaults){
  const m=a.model;
  if(id==='new'){
    let ctx={};if(a.ctx)ctx=a.ctx()||{};
    FV={a:a,id:null,isNew:true,dirty:false,buf:Object.assign(D.defaults(m),ctx,defaults||{}),tab:0,errs:{}};
    if(M[m].compute)M[m].compute(FV.buf);
    R.rid='new';
  }else{
    const r=D.get(m,+id);if(!r){R.rid=null;FV=null;return}
    FV={a:a,id:r.id,isNew:false,dirty:false,buf:clone(r),tab:0,errs:{}};
    R.rid=r.id;
  }
  setHash();
}
function validateForm(){
  const F=fieldsOf(FV.a.model);FV.errs={};
  Object.keys(F).forEach(k=>{const f=F[k];if(f.req&&(FV.buf[k]==null||FV.buf[k]===''))FV.errs[k]=1});
  return !Object.keys(FV.errs).length;
}
function saveForm(opt){
  if(!FV||!FV.dirty&&!FV.isNew)return true;
  if(!validateForm()){toast(tr('Veuillez remplir les champs obligatoires.','Please fill in the required fields.'));render();return false}
  const m=FV.a.model;
  if(FV.isNew){const rec=D.create(m,FV.buf);FV.id=rec.id;FV.isNew=false;R.rid=rec.id;FV.buf=clone(rec);setHash()}
  else{const vals=clone(FV.buf);delete vals.id;D.write(m,FV.id,vals);FV.buf=clone(D.get(m,FV.id))}
  FV.dirty=false;
  if(!(opt&&opt.quiet))toast(tr('Enregistré','Saved'));
  return true;
}
function leaveForm(){
  if(FV&&FV.dirty){
    if(!FV.isNew||Object.keys(FV.buf).some(k=>FV.buf[k]&&k!==FV.a.model)){
      if(!saveForm({quiet:true}))return false;
    }
  }
  FV=null;R.rid=null;setHash();return true;
}
function formLocked(){const m=FV.a.model;return M[m].lock?M[m].lock(FV.buf):false}
function fieldInputHtml(m,f,val,opts){

        (ro?'':'<select data-a="m2m-add" data-k="'+f.k+'" style="width:auto;border:1px dashed var(--line-2);border-radius:6px;padding:3px 6px"><option value="">+ '+tr('Ajouter','Add')+'</option>'+all.filter(o=>!cur.includes(o.id)).map(o=>'<option value="'+o.id+'">'+esc(o.n)+'</option>').join('')+'</select>')+'</div>';

let _toastT=null;
function toast(msg){
  let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}
  t.textContent=msg;t.style.display='block';t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop');clearTimeout(_toastT);_toastT=setTimeout(()=>{t.style.display='none'},2800);
}

/* ---------- routing ---------- */
function setHash(){
  let h='home';
  if(!ST.auth)h='login';
  else if(R.screen==='app'&&R.app)h=R.app+'.'+R.menu+(R.rid!=null?'.'+R.rid:'');
  try{history.replaceState(null,'','#'+h)}catch(e){}
  if(!_navBack&&ST&&ST.auth){const k=R.screen==='app'&&R.app?R.app+'|'+R.menu+'|'+(R.rid==null?'':R.rid):'home';if(NAVH[NAVH.length-1]!==k){NAVH.push(k);if(NAVH.length>60)NAVH.shift()}}
}
const NAVH=[];let _navBack=false;
A.back=()=>{
  if(FV&&R.rid!=null&&!leaveForm())return;
  NAVH.pop();const k=NAVH[NAVH.length-1];
  _navBack=true;
  try{
    if(!k||k==='home'){goHome()}
    else{const p=k.split('|');openApp(p[0],p[1]);if(p[2]!==''){const m=findMenu(appById(p[0]),p[1]);if(m&&m.act&&ACT[m.act]&&D.get(ACT[m.act].model,+p[2])){openForm(ACT[m.act],+p[2]);render()}}}
  }finally{_navBack=false}
};
function openApp(appId,menuId,keepRid){
  const ap=appById(appId);if(!ap)return;
  const m=(menuId&&findMenu(ap,menuId))||firstLeaf(ap);
  R.screen='app';R.app=appId;R.menu=m.id;if(!keepRid){R.rid=null;FV=null}
  UI.pop=null;UI.dd=null;UI.sdd=false;UI.sq='';UI.mm=false;
  const a=m.act&&ACT[m.act];if(a){const vs=vstate(a);if(m.view&&a.views.includes(m.view))vs.view=m.view}
  setHash();render();
  try{window.scrollTo(0,0)}catch(e){}
}
function goHome(){R.screen='home';R.app=null;R.menu=null;R.rid=null;FV=null;UI.pop=null;UI.dd=null;UI.sdd=false;UI.mm=false;setHash();render()}
function menuForAct(ap,actKey){let out=null;(function walk(ms){ms.forEach(m=>{if(m.act===actKey&&!out)out=m;if(m.ch)walk(m.ch)})})(ap.menus);return out}
function goTo(appId,actKey,rid){
  const ap=appById(appId);if(!ap)return;
  const m=menuForAct(ap,actKey);if(!m)return;
  if(FV&&R.rid!=null&&!leaveForm())return;
  openApp(appId,m.id);
  if(rid){openForm(ACT[actKey],rid);render()}
}
function parseHash(){
  const h=(location.hash||'').replace('#','');
  if(!h||h==='home'||h==='login')return;
  const p=h.split('.');const ap=appById(p[0]);if(!ap)return;
  const m=findMenu(ap,p[1])||firstLeaf(ap);
  R.screen='app';R.app=ap.id;R.menu=m.id;
  if(p[2]&&m.act&&ACT[m.act]){setTimeout(()=>{openForm(ACT[m.act],p[2]==='new'?'new':+p[2]);render()},0)}
}

function aiAnswer(q){
  const s=q.toLowerCase();const today=iso(new Date());
  const li=(n,label)=>'<a data-a="aigo" data-n="'+esc(n)+'">'+esc(label)+'</a>';
  if(/vente|chiffre|caisse du jour|sales|revenue/.test(s)&&!/ouvr|open/.test(s)){
    const os=D.all('posorder').filter(o=>(o.date||'').slice(0,10)===today&&o.state!=='cancel');
    const by={};os.forEach(o=>{by[o.pay]=(by[o.pay]||0)+o.total});
    return tr('Aujourd’hui : <b>'+money(sum(os,o=>o.total))+'</b> sur '+os.length+' commande(s). ','Today: <b>'+money(sum(os,o=>o.total))+'</b> across '+os.length+' order(s). ')+Object.keys(by).map(k=>selLabel(M.posorder.f.pay,k)+' '+money(by[k])).join(' · ')+'<br>'+li('pos:p_o',tr('Voir les commandes','View orders'));
  }
  if(/factur|impay|retard.*fact|invoice|overdue|unpaid/.test(s)){
    const l=D.all('invoice').filter(i=>i.kind==='out_invoice'&&i.state==='posted');const late=l.filter(i=>i.late);
    return tr('<b>'+l.length+'</b> facture(s) à encaisser pour <b>'+money(sum(l,i=>i.ttc))+'</b>, dont <b>'+late.length+'</b> en retard ('+money(sum(late,i=>i.ttc))+').','<b>'+l.length+'</b> invoice(s) to collect for <b>'+money(sum(l,i=>i.ttc))+'</b>, <b>'+late.length+'</b> overdue ('+money(sum(late,i=>i.ttc))+').')+'<br>'+li('billing:i_inv',tr('Ouvrir les factures','Open invoices'));
  }
  if(/créneau|creneau|libre|dispo|slot|free|available/.test(s)){
    const d=/aujourd|today/.test(s)?new Date():addDays(new Date(),1);const ds=iso(d);
    const out=['photo','podcast','video'].map(st=>{
      const busy=D.all('rental').filter(r=>r.studio===st&&r.state!=='cancel'&&(r.start||'').slice(0,10)===ds).sort((a,b)=>a.start>b.start?1:-1);
      let cur=9,free=[];busy.forEach(r=>{const a=pd(r.start).getHours(),b=pd(r.stop).getHours()+(pd(r.stop).getMinutes()?1:0);if(a>cur)free.push(pad(cur)+'h–'+pad(a)+'h');cur=Math.max(cur,b)});if(cur<20)free.push(pad(cur)+'h–20h');
      return '<b>'+selLabel(M.rental.f.studio,st)+'</b> : '+(free.join(', ')||tr('complet','full'));
    });
    return tr('Créneaux libres le ','Free slots on ')+fmtDate(ds)+'<br>'+out.join('<br>')+'<br>'+li('rental:r_p',tr('Voir le planning','Open schedule'));
  }
  if(/tâche|tache|task|retard.*tâ/.test(s)){
    const t=D.all('task').filter(x=>!taskDone(x)&&x.deadline&&x.deadline<today);
    return t.length?tr('<b>'+t.length+'</b> tâche(s) en retard : ','<b>'+t.length+'</b> late task(s): ')+t.slice(0,4).map(x=>esc(rn('task',x))).join(' · '):tr('Aucune tâche en retard. 👍','No late tasks. 👍');
  }
  if(/location|réserv|reserv|rental|booking/.test(s)){
    const r=D.all('rental').filter(x=>x.state!=='cancel'&&(x.start||'').slice(0,10)>=today).slice(0,5);
    return tr('Prochaines locations :','Upcoming rentals:')+'<br>'+r.map(x=>fmtShort(x.start)+' '+fmtHM(pd(x.start))+' — '+esc(D.name('partner',x.partner))).join('<br>');
  }
  const open=s.match(/ouvr|open|aller|go to|va /);
  if(open){
    const ap=APPS.find(a=>s.includes(L(a.l).toLowerCase())||s.includes(a.id)||(/caisse|till|pos/.test(s)&&a.id==='pos')||(/cuisine|kitchen/.test(s)&&a.id==='kitchen')||(/facture|invoice/.test(s)&&a.id==='billing'));
    if(ap){setTimeout(()=>{if(ap.id==='pos'&&/caisse|till/.test(s)){openApp('pos','p_dash')}else openApp(ap.id)},50);return tr('J’ouvre ','Opening ')+'<b>'+esc(L(ap.l))+'</b>…'}
  }
  if(/équipe|equipe|employ|team|staff/.test(s)){const e=D.all('employee');return tr('<b>'+e.length+'</b> personnes dans l’équipe : ','<b>'+e.length+'</b> people on the team: ')+e.map(x=>esc(x.name)).join(', ')+'.'}
  if(/aide|help|que peux|what can/.test(s))return tr('Je peux répondre sur : ventes du jour, factures en retard, créneaux libres, tâches en retard, locations à venir, équipe — ou ouvrir une application (« ouvre la caisse »).','I can answer about: today’s sales, overdue invoices, free slots, late tasks, upcoming rentals, team — or open an app (“open the till”).');
  return tr('Je ne suis pas sûr de comprendre. Essayez : « ventes du jour », « factures en retard », « créneaux libres demain » ou « aide ».','I’m not sure I understand. Try: “today’s sales”, “overdue invoices”, “free slots tomorrow” or “help”.');
}

/* ---------- export / import ---------- */
function csvCell(s){s=String(s==null?'':s);return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function toCSV(a,rows){
  const F=fieldsOf(a.model);const ks=Object.keys(F).filter(k=>F[k].t!=='lines'&&F[k].t!=='html');
  const head=['id'].concat(ks.map(k=>fl(F[k])));
  return [head.map(csvCell).join(',')].concat(rows.map(r=>[r.id].concat(ks.map(k=>rawVal(a.model,F[k],r))).map(csvCell).join(','))).join('\n');
}
async function exportCSV(a,rows){
  const csv='﻿'+toCSV(a,rows);const name='velume_'+a.model+'_'+iso(new Date())+'.csv';
  try{
    const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:csv});toast(tr('Export prêt : ','Export ready: ')+name);return}
  }catch(e){}
  openModal('csvview',{csv:csv,name:name});
}
MODALS.csvview={title:()=>tr('Export CSV','CSV export'),wide:true,body:p=>'<p class="muted" style="margin-bottom:8px">'+tr('Le téléchargement direct n’est pas disponible ici : copiez ce contenu dans un fichier .csv.','Direct download is unavailable here: copy this content into a .csv file.')+'</p><textarea readonly rows="12" style="width:100%;font-family:monospace;font-size:.82rem">'+esc(p.csv)+'</textarea>',foot:p=>'<button class="btn pri" data-a="copycsv">'+ic('copy')+tr('Copier','Copy')+'</button><button class="btn" data-a="mclose">'+tr('Fermer','Close')+'</button>'};

MODALS.import={title:()=>tr('Importer des enregistrements','Import records'),wide:true,
  body:p=>'<p class="muted" style="margin-bottom:8px">'+tr('Collez un CSV (première ligne = noms des colonnes, séparateur virgule ou point-virgule). Les colonnes sont associées aux champs par leur libellé.','Paste a CSV (first row = column names, comma or semicolon). Columns are matched to fields by label.')+'</p><textarea data-m="csv" rows="9" style="width:100%;font-family:monospace;font-size:.84rem" placeholder="Nom;Téléphone&#10;Test client;+237 6 00 00 00 99"></textarea><div id="impres" class="muted" style="margin-top:6px"></div>',
  foot:p=>'<button class="btn pri" data-a="import-go">'+tr('Importer','Import')+'</button><button class="btn" data-a="mclose">'+tr('Annuler','Cancel')+'</button>'};
function parseCSV(t){
  const sep=(t.split('\n')[0].match(/;/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);return rows;
}
A['import-go']=()=>{
  const a=ACT[UI.modal.p.act];const t=(UI.modal.data.csv||'').replace(/^﻿/,'');if(!t.trim())return toast(tr('Rien à importer.','Nothing to import.'));
  const rows=parseCSV(t);const F=fieldsOf(a.model);const head=rows[0].map(h=>h.trim().toLowerCase());
  const map=head.map(h=>Object.keys(F).find(k=>fl(F[k]).toLowerCase()===h||k.toLowerCase()===h||(F[k].en||'').toLowerCase()===h));
  if(!map.some(Boolean))return toast(tr('Aucune colonne reconnue.','No column recognised.'));
  let n=0;
  rows.slice(1).forEach(r=>{
    const v={};map.forEach((k,i)=>{if(!k)return;const f=F[k];let x=r[i];if(x==null||x==='')return;
      if(f.t==='int'||f.t==='float'||f.t==='money')x=+String(x).replace(/\s/g,'').replace(',','.');
      else if(f.t==='m2o'){const rec=D.all(f.rel).find(y=>rn(f.rel,y).toLowerCase()===String(x).toLowerCase());x=rec?rec.id:null}
      else if(f.t==='sel'){const o=(f.opts||[]).find(o=>[o[0],o[1],o[2]].map(s=>String(s).toLowerCase()).includes(String(x).toLowerCase()));x=o?o[0]:x}
      else if(f.t==='bool')x=/^(1|oui|yes|true)$/i.test(x);
      v[k]=x});
    if(Object.keys(v).length){D.create(a.model,v);n++}
  });
  UI.modal=null;toast(tr(n+' enregistrement(s) importé(s)',n+' record(s) imported'));render();
};
